<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Town</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Verdana, Geneva, sans-serif;
    background: #bfe6ff;
    color: #23324a;
    display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden;
  }
  button { font-family: Verdana, Geneva, sans-serif; }
  h1 {
    margin: 14px 0 4px; font-size: clamp(22px, 5vw, 34px);
    color: #2b4c8c; letter-spacing: 1px;
  }
  .hint { margin: 0 0 10px; font-size: clamp(13px, 3vw, 16px); padding: 0 16px; text-align: center; }
  body { padding-bottom: 96px; }
  #wrap {
    position: relative; width: min(100vw - 16px, 1100px);
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(30, 60, 110, .25);
    margin-bottom: 16px;
  }
  #map { display: block; width: 100%; height: auto; transform-origin: 50% 50%; transition: transform .38s ease-in; }
  #map.zoom { transform: scale(3.2); }
  #fade { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .3s ease-in .08s; }
  #fade.on { opacity: 1; }

  .bld { cursor: pointer; outline: none; }
  .bld .lift { transition: transform .2s ease; transform-box: fill-box; transform-origin: 50% 100%; }
  .bld:hover .lift, .bld:focus-visible .lift { transform: translateY(-6px) scale(1.04); }
  .bld:focus-visible .glow, .bld:hover .glow { opacity: .3; }
  .glow { opacity: 0; transition: opacity .2s; }
  .bld.shake .lift { animation: shake .45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-7px); } 40% { transform: translateX(7px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }
  .open-star { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes twinkle { 50% { transform: scale(1.25) rotate(20deg); } }
  .splash { animation: splash 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes splash { 50% { transform: scale(1.6); opacity: .6; } }

  #toast {
    position: absolute; left: 50%; top: 14px; transform: translate(-50%, -30px);
    background: #fff; border: 3px solid #2b4c8c; border-radius: 14px;
    padding: 10px 18px; font-size: clamp(13px, 2.6vw, 18px); font-weight: bold;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #start {
    position: fixed; inset: 0; background: rgba(35, 60, 110, .55);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    z-index: 100; transition: opacity .35s;
  }
  #start.hide { opacity: 0; pointer-events: none; }
  .card {
    background: #fff; border-radius: 22px; padding: 26px 28px; max-width: 420px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: pop .45s ease-out;
  }
  .card h2 { margin: 0 0 10px; color: #2b4c8c; font-size: 28px; }
  .card p { margin: 0 0 18px; line-height: 1.5; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .big {
    min-height: 52px; padding: 12px 34px; font-size: 20px; font-weight: bold;
    border: none; border-radius: 30px; background: #ff7aa8; color: #fff; cursor: pointer;
    box-shadow: 0 4px 0 #d9567f; transition: transform .1s;
  }
  .big:active { transform: translateY(3px); box-shadow: 0 1px 0 #d9567f; }


  /* ---------- rooms (inside a building) ---------- */
  #roomWrap { position: relative; width: min(100vw - 16px, 1100px); border-radius: 18px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(30, 60, 110, .25); margin-bottom: 16px; }
  #room { display: block; width: 100%; height: auto; transform-origin: 50% 50%; transition: transform .38s ease-in; }
  #room.zoom { transform: scale(2.4); }
  .view-hidden { display: none !important; }
  #backMap {
    position: absolute; left: 12px; top: 12px; z-index: 2;
    display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; padding: 0;
    border: none; border-radius: 26px; background: #fff; color: #6b4329; font-size: 18px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 0 #e2c9b4, 0 6px 14px rgba(0,0,0,.12); transition: transform .1s;
  }
  #backMap:active { transform: translateY(3px); box-shadow: 0 1px 0 #e2c9b4; }
  #backMap svg { width: 26px; height: 26px; }
  @media (max-width: 600px) { #backMap { left: 8px; top: 8px; width: 46px; height: 46px; } #backMap svg { width: 20px; height: 20px; } }
  .spot { cursor: pointer; outline: none; }
  .spot .ring { opacity: 0; transition: opacity .25s; }
  .spot:hover .ring, .spot:focus-visible .ring { opacity: 1; }
  .spot.hint .ring { animation: ringPulse 1.6s ease-in-out infinite; }
  @keyframes ringPulse { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  .sparkle { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .spot.hint .sparkle { animation: sparkle 1.6s ease-in-out infinite; }
  @keyframes sparkle { 0%,100% { opacity: 0; transform: scale(.4) rotate(0deg); } 50% { opacity: 1; transform: scale(1.1) rotate(25deg); } }
  #roomFade { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .3s ease-in .08s; }
  #roomFade.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .open-star, .splash { animation: none; }
    #map { transition: none; }
    #map.zoom, #room.zoom { transform: none; }
    .spot.hint .ring, .spot.hint .sparkle { animation: none; opacity: .8; }
    .bld .lift { transition: none; }
  }

  /* ---------- full screen scenes (style-guide.md) ---------- */
  html, body { overflow: hidden; }
  body { padding: 0 !important; background: #f3edf8; }
  #wrap, #roomWrap { position: fixed; inset: 0; width: auto; margin: 0; border-radius: 0; box-shadow: none; overflow: hidden; }
  #map, #room { position: relative; width: 100%; height: 100%; }
  /* the picture fits the screen; a soft blurred copy fills the edges on wide or tall screens */
  .backdrop { position: absolute; inset: -40px; background: center / cover no-repeat; filter: blur(22px) saturate(1.05) brightness(1.04); opacity: .9; }
  #backMap { left: 14px; top: 14px; width: 56px; height: 56px; border-radius: 50%; background: #e0457b;
    box-shadow: 0 4px 0 #b8336a, 0 8px 18px rgba(74, 59, 92, .2); }
  #backMap:active { transform: translateY(4px); box-shadow: 0 0 0 #b8336a; }
  #backMap svg path { stroke: #fff; }
  @media (max-width: 600px) { #backMap { left: 10px; top: 10px; width: 48px; height: 48px; } }
</style>
</head>

<!-- ===== toolbar (same on every screen; paste right after <body>; follows style-guide.md) ===== -->
<style>
  #tb { position: fixed; right: 12px; bottom: 12px; z-index: 40; display: flex; align-items: flex-end; gap: 10px;
    padding: 10px 10px 10px 12px; background: #fff; border-radius: 26px;
    box-shadow: 0 0 0 2px #f3edf8, 0 10px 30px rgba(120, 60, 120, .18); font-family: Verdana, Geneva, sans-serif;
    animation: tbIn .5s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes tbIn { from { transform: translateY(130%); } to { transform: none; } }
  #tb button { font-family: inherit; border: none; -webkit-tap-highlight-color: transparent; }
  .tb-btn { position: relative; width: 56px; height: 56px; padding: 7px; border-radius: 18px; background: #f3edf8; cursor: pointer;
    box-shadow: 0 4px 0 #ddd0ec; transition: transform .12s, box-shadow .12s, background .2s; }
  .tb-btn svg { width: 100%; height: 100%; display: block; transition: transform .2s; }
  .tb-btn:hover svg, .tb-btn:focus-visible svg { transform: translateY(-3px) rotate(-6deg); }
  .tb-btn:active, .tb-me:active { transform: translateY(4px); box-shadow: 0 0 0 #ddd0ec; }
  .tb-btn.here { background: #ffe8f0; box-shadow: 0 4px 0 #f5bcd0; }
  .tb-btn.wiggle svg { animation: tbWiggle .5s; }
  @keyframes tbWiggle { 20% { transform: rotate(-14deg); } 40% { transform: rotate(11deg); } 60% { transform: rotate(-7deg); } 80% { transform: rotate(4deg); } }
  .tb-btn .tb-lock { position: absolute; right: -8px; top: -8px; width: 24px; height: 24px; filter: drop-shadow(0 2px 3px rgba(74, 59, 92, .25)); }
  .tb-me { position: relative; width: 84px; height: 112px; margin-top: -50px; padding: 6px; border-radius: 20px; cursor: pointer;
    background: linear-gradient(#fff 55%, #ffe8f0); box-shadow: 0 4px 0 #f5bcd0, 0 8px 18px rgba(74, 59, 92, .15);
    transition: transform .12s, box-shadow .12s; }
  .tb-me img, .tb-me svg { width: 100%; height: 100%; display: block; object-fit: contain; }
  .tb-me [hidden] { display: none; }
  .tb-me.stamp { animation: tbStamp .6s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes tbStamp { 0% { transform: scale(1); } 30% { transform: scale(1.28, .78); } 60% { transform: scale(.92, 1.12); } 100% { transform: scale(1); } }
  .tb-spark { position: fixed; width: 14px; height: 14px; z-index: 96; pointer-events: none;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: tbSpark .8s ease-out forwards; }
  @keyframes tbSpark { from { transform: translate(0, 0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(90deg); opacity: 0; } }
  .tb-panel { position: absolute; right: 70px; bottom: calc(100% + 16px); display: grid; grid-template-columns: repeat(3, 64px); gap: 10px;
    padding: 14px; background: #fff; border-radius: 22px; box-shadow: 0 0 0 2px #f3edf8, 0 10px 30px rgba(120, 60, 120, .18);
    transform: translateY(16px) scale(.6); transform-origin: 70% 100%; opacity: 0; pointer-events: none; transition: transform .25s cubic-bezier(.3, 1.5, .5, 1), opacity .2s; }
  .tb-panel.open { transform: none; opacity: 1; pointer-events: auto; }
  .tb-slot { width: 64px; height: 64px; border-radius: 16px; background: #f8f4fc; box-shadow: inset 0 3px 6px rgba(120, 60, 120, .08); display: flex; align-items: center; justify-content: center; }
  .tb-slot svg { width: 22px; height: 22px; opacity: .5; }
  @media (max-width: 600px) {
    #tb { right: 8px; bottom: 8px; gap: 6px; padding: 7px 7px 7px 8px; border-radius: 22px; }
    .tb-btn { width: 46px; height: 46px; padding: 5px; border-radius: 15px; }
    .tb-me { width: 66px; height: 90px; margin-top: -40px; padding: 5px; }
    .tb-panel { right: 0; grid-template-columns: repeat(3, 56px); } .tb-slot { width: 56px; height: 56px; }
  }
  @media (prefers-reduced-motion: reduce) { #tb, .tb-me.stamp, .tb-btn.wiggle svg { animation: none !important; } }
</style>
<nav id="tb" aria-label="My things">
  <button class="tb-btn" id="tbTown" aria-label="Back to town">
    <svg viewBox="0 0 48 48"><path d="M4 42h40" stroke="#8cc976" stroke-width="5" stroke-linecap="round"/><rect x="6" y="24" width="15" height="17" rx="2" fill="#ffd166"/><path d="M4 26 13.5 15 23 26z" fill="#e0457b" stroke="#e0457b" stroke-width="2" stroke-linejoin="round"/><rect x="11" y="31" width="5" height="10" rx="1.5" fill="#b8336a"/><rect x="24" y="16" width="18" height="25" rx="2" fill="#9fd0f5"/><path d="M22 18 33 8l11 10z" fill="#7b5cd6" stroke="#7b5cd6" stroke-width="2" stroke-linejoin="round"/><rect x="27.5" y="21" width="4.5" height="4.5" rx="1" fill="#fff"/><rect x="34" y="21" width="4.5" height="4.5" rx="1" fill="#fff"/><rect x="30" y="31" width="6" height="10" rx="1.5" fill="#4a9be0"/></svg>

    <svg viewBox="0 0 48 48"><rect x="31" y="8" width="7" height="13" rx="2" fill="#d9607f"/><rect x="10" y="21" width="28" height="21" rx="3" fill="#fff1e0"/><path d="M27 21h8a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3h-8z" fill="#f3dcc4"/><rect x="20" y="29" width="8" height="13" rx="2.5" fill="#c98a55"/><rect x="24" y="29" width="4" height="13" rx="1.5" fill="#b07444"/><rect x="13" y="26" width="5" height="5" rx="1.5" fill="#a9d8f5"/><rect x="30" y="26" width="5" height="5" rx="1.5" fill="#8cc4e8"/><polygon points="5,23.5 24,7 43,23.5" fill="#f07c9a" stroke="#f07c9a" stroke-width="4" stroke-linejoin="round"/><polygon points="24,7 43,23.5 34,23.5" fill="#d9607f" stroke="#d9607f" stroke-width="4" stroke-linejoin="round"/></svg>

<script data-root="">
// Toolbar: house, backpack, boutique, and your doll. Saved in the browser so it follows you around town.
(function () {
  const ROOT = document.currentScript.dataset.root, KEY = 'myTown.v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  window.tbData = data;
  window.tbSave = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  const $ = id => document.getElementById(id);
  const STAR = '<svg viewBox="0 0 24 24"><polygon points="12,2 14.9,8.6 22,9.2 16.6,13.9 18.2,21 12,17.3 5.8,21 7.4,13.9 2,9.2 9.1,8.6" fill="#ddd0ec"/></svg>';
  $('tbPanel').innerHTML = Array(6).fill('<div class="tb-slot">' + STAR + '</div>').join('');   // empty for now: things to collect
  function render() {
    const has = !!data.avatar;
    $('tbMeImg').hidden = !has; $('tbEmpty').hidden = has;
    if (has) $('tbMeImg').src = data.avatar;
  }
  let ac;
  function beep(notes, type) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime;
      notes.forEach(([f, d, l]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type || 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.14, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + l);
        o.connect(g).connect(ac.destination); o.start(t + d); o.stop(t + d + l + .05);
      });
    } catch (e) {}
  }
  window.tbBeep = beep;
  window.tbSparkle = (el, n) => {
    const r = el.getBoundingClientRect(), cols = ['#ffc94d', '#e0457b', '#7b5cd6', '#3bb273', '#4a9be0'];
    for (let i = 0; i < (n || 14); i++) {
      const s = document.createElement('div'), a = Math.random() * 6.28, d = 45 + Math.random() * 55;
      s.className = 'tb-spark'; s.style.background = cols[i % cols.length];
      s.style.left = (r.left + r.width / 2 - 7) + 'px'; s.style.top = (r.top + r.height / 2 - 7) + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(s); setTimeout(() => s.remove(), 850);
    }
  };
  window.tbSetAvatar = (url, extra) => {
    data.avatar = url; Object.assign(data, extra || {}); tbSave(); render();
    const b = $('tbMe'); b.classList.remove('stamp'); void b.offsetWidth; b.classList.add('stamp');
    tbSparkle(b, 18);
  };
  function wiggle(b) { b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); }
  $('tbMe').onclick = () => { beep([[659, 0, .12], [988, .08, .2]]); if (window.tbOnMe && tbOnMe()) return; location.href = ROOT + 'dress-up/dress-up.html'; };
  $('tbTown').onclick = () => { beep([[392, 0, .12], [523, .08, .2]]); if (window.tbOnTown && tbOnTown()) return; location.href = ROOT + 'index.html#town'; };
  $('tbHome').onclick = () => { wiggle($('tbHome')); beep([[330, 0, .15], [262, .12, .2]], 'sine'); };
  $('tbBag').onclick = e => {
    e.stopPropagation(); wiggle($('tbBag'));
    const open = $('tbPanel').classList.toggle('open');
    beep(open ? [[440, 0, .1], [660, .07, .15]] : [[660, 0, .1], [440, .07, .15]]);
  };
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#tbPanel') && !e.target.closest('#tbBag')) $('tbPanel').classList.remove('open'); });
  render();
})();
</script>

<script>
// ---------- Places on the map ----------
// The map is one picture (town-map.jpg, embedded below). Each place is a tap area drawn over its building.
// A building opens when it has a room in ROOMS below (or, with no room, a "link" straight to a game file).
const MAP_W = 1376, MAP_H = 768;   // size of the map picture
const PLACES = [
  { id: 'boutique', name: 'Boutique',      x: 240, y: 15,  w: 218, h: 213 },
  { id: 'store',    name: 'General Store', x: 486, y: 44,  w: 200, h: 180 },
  { id: 'library',  name: 'Library',       x: 710, y: 10,  w: 226, h: 232 },
  { id: 'vet',      name: 'Pet Vet',       x: 964, y: 64,  w: 190, h: 162 },
  { id: 'garden',   name: 'Garden Center', x: 765, y: 290, w: 275, h: 200 },
  { id: 'school',   name: 'School',        x: 220, y: 536, w: 230, h: 196 },
  { id: 'grocery',  name: 'Grocery',       x: 464, y: 576, w: 196, h: 168 },
  { id: 'post',     name: 'Post Office',   x: 684, y: 544, w: 212, h: 200 },
];

// ---------- Rooms (the inside of each building) ----------
// Each room is one picture plus tap spots. A spot's "link" is the game it opens.
// Spot x, y, w, h are pixels on the room picture (view = the picture's full size).
// To add a room: put its picture in images/, embed it here, and list its tap spots.

const svg = document.getElementById('map');

function building(p) {
  const { x, y, w, h } = p;
  const open = !!(ROOMS[p.id] || p.link);
  const sw = Math.max(86, p.name.length * 11 + 26), sx = x + w / 2 - sw / 2, sy = y + h - 10;
  return `<g class="bld" data-id="${p.id}" tabindex="0" role="button" aria-label="${p.name}${open ? '' : ', coming soon'}">
    <rect class="glow" x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="#fff8c4" opacity="0"/>
    <g class="lift">
      <rect x="${sx}" y="${sy}" width="${sw}" height="26" rx="13" fill="#fff" stroke="#8a5a3b" stroke-width="2.5"/>
      <text x="${x + w / 2}" y="${sy + 18}" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b4329">${p.name}</text>
      ${open ? `<g class="open-star"><polygon points="${starPts(x + w - 10, y + 10, 18, 8)}" fill="#ffd34d" stroke="#e6a817" stroke-width="3" stroke-linejoin="round"/></g>` : ''}
    </g>
  </g>`;
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const c = s => Math.max(0, Math.min(255, ((n >> s) & 255) + amt));
  return '#' + ((1 << 24) | (c(16) << 16) | (c(8) << 8) | c(0)).toString(16).slice(1);
}

function starPts(cx, cy, R, r) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R;
    pts.push((cx + rad * Math.cos(a)).toFixed(1) + ',' + (cy + rad * Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}

// A car seen from above, pointing right
function car(id, color) {
  const light = shade(color, 45), dark = shade(color, -40);
  return `<g id="${id}">
    <rect x="-23" y="-12" width="48" height="27" rx="8" fill="rgba(0,0,0,.18)"/>
    <rect x="5" y="-15" width="5" height="4" rx="1.5" fill="${dark}"/><rect x="5" y="11" width="5" height="4" rx="1.5" fill="${dark}"/>
    <rect x="-24" y="-13" width="48" height="26" rx="8" fill="${color}" stroke="${dark}" stroke-width="2"/>
    <rect x="3" y="-10" width="9" height="20" rx="3" fill="#2f4a66"/>
    <rect x="-17" y="-9" width="6" height="18" rx="2.5" fill="#2f4a66"/>
    <rect x="-11" y="-10" width="14" height="20" rx="3" fill="${light}"/>
    <circle cx="21" cy="-8" r="2.5" fill="#fff6b0"/><circle cx="21" cy="8" r="2.5" fill="#fff6b0"/>
    <rect x="-24" y="-10" width="3" height="5" rx="1" fill="#e0303a"/><rect x="-24" y="5" width="3" height="5" rx="1" fill="#e0303a"/>
  </g>`;
}

const CARS = [['#ff6b5e', 120], ['#4d8eff', 100], ['#ffc93d', 90], ['#5cc48a', 110], ['#b07ef0', 95]];

function drawMap() {
  let s = '';
  document.getElementById('mapBg').style.backgroundImage = `url(${MAP_IMG})`;
  s += `<image href="${MAP_IMG}" x="0" y="0" width="${MAP_W}" height="${MAP_H}" preserveAspectRatio="none"/>`;
  // fountain splash on the fountain in the middle of the roundabout
  s += `<circle class="splash" cx="500" cy="370" r="5" fill="#e6f7ff" opacity=".9"/>`;
  // invisible car routes, then the cars
  s += ROUTES.map((d, i) => `<path id="route${i}" d="${d}" fill="none"/>`).join('');
  s += CARS.map(([c], i) => car('car' + i, c)).join('');
  s += ROOFS.map(([x, y, w, h, src]) => `<image href="${src}" x="${x}" y="${y}" width="${w}" height="${h}" pointer-events="none"/>`).join('');
  // clouds drifting over the town
  s += `<g id="cloud1" opacity=".85"><ellipse cx="0" cy="0" rx="46" ry="18" fill="#fff"/><ellipse cx="-20" cy="-10" rx="22" ry="16" fill="#fff"/><ellipse cx="16" cy="-14" rx="26" ry="18" fill="#fff"/></g>
        <g id="cloud2" opacity=".75"><ellipse cx="0" cy="0" rx="38" ry="14" fill="#fff"/><ellipse cx="12" cy="-10" rx="22" ry="14" fill="#fff"/></g>`;
  // tap areas and name signs for the buildings
  PLACES.forEach(p => s += building(p));
  svg.innerHTML = s;
}
drawMap();

// ---------- Moving things ----------
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const movers = CARS.map(([, speed], i) => {
  const path = document.getElementById('route' + i);
  const len = path.getTotalLength();
  return { el: document.getElementById('car' + i), path, len, speed, d: len * ((i * 0.37) % 1) };
});
const c1 = document.getElementById('cloud1'), c2 = document.getElementById('cloud2');
let last = performance.now(), cx1 = 120, cx2 = 700;
function tick(now) {
  const dt = Math.min(50, now - last) / 1000; last = now;
  if (!reduce) {
    cx1 += 10 * dt; if (cx1 > MAP_W + 60) cx1 = -60;
    cx2 += 6 * dt; if (cx2 > MAP_W + 60) cx2 = -60;
  }
  movers.forEach(m => {
    if (!reduce) { m.d += m.speed * dt; if (m.d > m.len) m.d = 0; }
    const p = m.path.getPointAtLength(m.d), q = m.path.getPointAtLength(Math.min(m.len, m.d + 6));
    const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
    m.el.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
  });
  c1.setAttribute('transform', `translate(${cx1},48)`);
  c2.setAttribute('transform', `translate(${cx2},80)`);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- Sounds ----------
let actx;
function beep(notes, type = 'triangle') {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach(([f, t, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const st = actx.currentTime + t;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.18, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + d);
      o.connect(g).connect(actx.destination); o.start(st); o.stop(st + d + 0.05);
    });
  } catch (e) {}
}

// ---------- Clicking buildings ----------
const toast = document.getElementById('toast');
let toastTimer, leaving = false;
function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function enter(g) {
  if (leaving) return;
  const p = PLACES.find(q => q.id === g.dataset.id);
  const room = ROOMS[p.id];
  if (!room && !p.link) {
    g.classList.remove('shake'); void g.getBBox(); g.classList.add('shake');
    setTimeout(() => g.classList.remove('shake'), 500);
    beep([[330, 0, .15], [262, .12, .2]], 'sine');
    showToast(`The ${p.name} is coming soon!`);
    return;
  }
  leaving = true;
  beep([[523, 0, .2], [659, .1, .2], [784, .2, .35]]);
  const map = document.getElementById('map');
  const ox = ((p.x + p.w / 2) / MAP_W) * 100, oy = ((p.y + p.h - 26) / MAP_H) * 100;
  map.style.transformOrigin = `${ox}% ${oy}%`;
  map.classList.add('zoom');
  document.getElementById('fade').classList.add('on');
  if (room) {
    history.pushState(null, '', '#' + p.id);    // the Back button returns to the map
    setTimeout(() => showRoom(p.id, true), reduce ? 100 : 400);
  } else {
    history.replaceState(null, '', '#town');   // coming back skips the Start screen
    setTimeout(() => { location.href = p.link; }, reduce ? 150 : 420);
  }
}

// ---------- Inside a building ----------
const roomSvg = document.getElementById('room');
let roomId = null, hintTimer, roomLeaving = false;

function drawRoom(id) {
  const r = ROOMS[id], [W, H] = r.view;
  roomSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  roomSvg.setAttribute('aria-label', `Inside the ${r.name}`);
  let s = `<image href="${r.img}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none"/>`;
  r.spots.forEach(sp => {
    const { x, y, w, h } = sp, st = (cx, cy, R) => `<polygon class="sparkle" style="animation-delay:${((cx + cy) % 5) * .25}s" points="${starPts(cx, cy, R, R * .42)}" fill="#fff6b0" stroke="#f2c14e" stroke-width="5" stroke-linejoin="round"/>`;
    s += `<g class="spot" data-spot="${sp.id}" tabindex="0" role="button" aria-label="${sp.name}">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="40" fill="rgba(255,255,255,0)"/>
      <rect class="ring" x="${x + 6}" y="${y + 6}" width="${w - 12}" height="${h - 12}" rx="40" fill="rgba(255,246,176,.18)" stroke="#fff6b0" stroke-width="14"/>
      ${st(x + 40, y + 30, 44)}${st(x + w - 40, y + 70, 36)}${st(x + 20, y + h * .55, 30)}${st(x + w - 20, y + h * .62, 40)}${st(x + w / 2, y - 10, 34)}
    </g>`;
  });
  roomSvg.innerHTML = s;
  document.getElementById('roomBg').style.backgroundImage = `url(${r.img})`;
}

function showRoom(id, fromMap) {
  roomId = id; roomLeaving = false;
  const r = ROOMS[id];
  drawRoom(id);
  document.getElementById('wrap').classList.add('view-hidden');
  document.getElementById('roomWrap').classList.remove('view-hidden');
  roomSvg.classList.remove('zoom');
  const rf = document.getElementById('roomFade');
  rf.style.transition = 'none'; rf.classList.add('on'); void rf.offsetWidth; rf.style.transition = ''; rf.classList.remove('on');
  start.classList.add('hide');
  // get the game ready in the background so it opens quickly
  r.spots.forEach(sp => {
    if (sp.link && !document.querySelector(`link[href="${sp.link}"]`)) {
      const l = document.createElement('link'); l.rel = 'prefetch'; l.href = sp.link; document.head.appendChild(l);
    }
  });
  // after a few seconds, sparkle what you can tap
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => roomSvg.querySelectorAll('.spot').forEach(s => s.classList.add('hint')), 2500);
}

function showMap() {
  roomId = null; leaving = false; clearTimeout(hintTimer);
  document.getElementById('roomWrap').classList.add('view-hidden');
  document.getElementById('wrap').classList.remove('view-hidden');
  document.getElementById('map').classList.remove('zoom');
  document.getElementById('fade').classList.remove('on');
}

function useSpot(el) {
  if (roomLeaving || !roomId) return;
  const sp = ROOMS[roomId].spots.find(s => s.id === el.dataset.spot);
  if (!sp.link) return;
  roomLeaving = true;
  beep([[659, 0, .15], [784, .1, .15], [1047, .2, .3]]);
  const [W, H] = ROOMS[roomId].view;
  roomSvg.style.transformOrigin = `${((sp.x + sp.w / 2) / W) * 100}% ${((sp.y + sp.h / 2) / H) * 100}%`;
  roomSvg.classList.add('zoom');
  document.getElementById('roomFade').classList.add('on');
  setTimeout(() => { location.href = sp.link; }, reduce ? 150 : 420);
}

roomSvg.addEventListener('click', e => { const s = e.target.closest('.spot'); if (s) useSpot(s); });
roomSvg.addEventListener('keydown', e => {
  const s = e.target.closest('.spot');
  if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); useSpot(s); }
});
document.getElementById('backMap').addEventListener('click', () => {
  beep([[440, 0, .12], [330, .08, .18]], 'sine');
  history.replaceState(null, '', '#town');
  showMap();
});

// Pick the right view from the address: #boutique opens that room, anything else shows the map
function fromHash() {
  const id = location.hash.slice(1);
  if (ROOMS[id]) showRoom(id); else showMap();
}
window.addEventListener('popstate', fromHash);

svg.addEventListener('click', e => { const g = e.target.closest('.bld'); if (g) enter(g); });
svg.addEventListener('keydown', e => {
  const g = e.target.closest('.bld');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); enter(g); }
});

// Reset when coming back with the Back button
window.addEventListener('pageshow', () => {
  leaving = false; roomLeaving = false;
  toast.classList.remove('show');
  roomSvg.classList.remove('zoom');
  document.getElementById('roomFade').classList.remove('on');
  fromHash();
});

// ---------- Toolbar buttons ----------
// Your doll: open Dress Up (coming back returns here)
window.tbOnMe = () => { history.replaceState(null, '', roomId ? '#' + roomId : '#town'); return false; };

// ---------- Start screen ----------
const start = document.getElementById('start');
if (location.hash === '#town' || ROOMS[location.hash.slice(1)]) start.classList.add('hide');
document.getElementById('go').addEventListener('click', () => {
  beep([[440, 0, .12], [660, .08, .2]]);
  start.classList.add('hide');
});
</script>
</body>
</html>
