<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vet Clinic</title>
<!-- My Town game starter (tools/make_game.py fills the {{...}} parts). Follows game-design and style-guide.md:
     one self-contained file, Verdana, mouse + touch, soft flat look, no outer outlines.
     Pictures go in the ART block below as data URLs so dress-up/tools/du.py can read and write them. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Verdana, Geneva, sans-serif; color: #2b2340; overflow-x: hidden;
    background: linear-gradient(160deg, #fff4e6 0%, #ffe3ef 50%, #e3f2ff 100%);
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }
  #game { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 10px 16px 96px; }
  header { width: 100%; max-width: 1000px; display: flex; align-items: center; gap: 12px; }
  header h2 { margin: 0; font-size: 26px; color: #3bb273; }
  .back { min-width: 56px; height: 52px; border: none; border-radius: 14px; background: #3bb273; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .back svg { width: 28px; height: 28px; }
  .back:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .play { flex: 1; width: 100%; max-width: 1000px; margin-top: 10px; min-height: 0; background: #fff; border-radius: 24px; box-shadow: 0 10px 30px rgba(120, 60, 120, .15); display: flex; align-items: center; justify-content: center; }
  .hello { font-size: 20px; color: #8a7a9c; animation: pop .4s backwards; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (max-width: 600px) { #game { padding: 8px 10px 100px; } header h2 { font-size: 20px; } .back { min-width: 48px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  /* Back: arrow, town icon and words, like the other rounded shadowed buttons */
  .backtown { display: inline-flex; align-items: center; gap: 6px; width: auto; padding: 0 14px 0 8px; color: #fff; font-weight: bold; font-size: 16px; white-space: nowrap; text-decoration: none; }
  .backtown svg { width: 24px; height: 24px; flex: 0 0 auto; }
  .backtown .back-ic { width: 34px; height: 34px; flex: 0 0 auto; filter: drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
  @media (max-width: 600px) { .backtown .back-words { display: none; } .backtown { padding: 0 8px; } }
  .backtown .back-ic { background: #fff; border-radius: 10px; padding: 2px; }   /* the town icon sits on a white badge so it shows on any button color */

  /* ---------- Vet Clinic ---------- */
  .play { position: relative; overflow: hidden; background: #cdebd9; padding: 0; }
  #room { width: 100%; height: 100%; display: block; touch-action: none; }
  /* task list in the header: slides out once when you come in; the current task is the biggest */
  .tasks { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; animation: tasksIn .5s .3s ease-out backwards; }
  @keyframes tasksIn { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .task { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px 0 6px; border: 3px solid #b9dcc6; border-radius: 999px; background: #fff; font-size: 16px; font-weight: bold; color: #7d9a88; }
  .task svg { width: 32px; height: 32px; flex: 0 0 auto; }
  .task.cur { height: 62px; padding: 0 20px 0 8px; border: 4px solid #3bb273; font-size: 22px; color: #2b6e47; }
  .task.cur svg { width: 46px; height: 46px; }
  .task.done { background: #e3f6ea; color: #6f9f80; }
  .task.pop { animation: popSoft .35s ease-out; }
  @keyframes popSoft { from { transform: scale(.85); opacity: .4; } to { transform: scale(1); opacity: 1; } }
  @media (max-width: 760px) { .task:not(.cur) span { display: none; } .task:not(.cur) { padding: 0 5px; } .task.cur { font-size: 15px; } }
  /* tap targets: a soft ring shows only when it is your turn to tap it, or while you hover right on it.
     While you hover one thing, only that thing lights up. */
  .tgt { cursor: pointer; outline: none; }
  .petg { outline: none; }
  .petg.drag { cursor: grab; }
  .petg.dragging { cursor: grabbing; }
  .ring, .tag { opacity: 0; transition: opacity .15s; }
  .tag { pointer-events: none; }
  .tgt:hover .ring, .tgt:focus-visible .ring { opacity: .75; }
  .tgt.on .ring, .petg.drag .ring { opacity: 1; }
  .tgt.done { cursor: default; }
  .tgt.done:hover .ring, .tgt.done:hover .tag { opacity: 0 !important; }
  .tgt.on .tag, .tgt.named .tag, .tgt:hover .tag, .tgt:focus-visible .tag { opacity: 1; }
  .pick-arrow { pointer-events: none; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(14px); } }
  #room:has(.tgt:hover, .petg.drag:hover) .tgt:not(:hover) .ring,
  #room:has(.tgt:hover, .petg.drag:hover) .tgt:not(:hover) .tag,
  #room:has(.tgt:hover) .petg .ring { opacity: 0; }
  .tgt.shake { animation: shake .47s; transform-box: fill-box; transform-origin: center; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .petg { transform-box: view-box; }
  .pet.in { animation: popSoft .4s ease-out; transform-box: fill-box; transform-origin: 50% 100%; }
  .readout { opacity: 0; transition: opacity .2s; pointer-events: none; }
  .readout.show { opacity: 1; }
  /* the guide: one short line that says what to do next */
  .guide { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; background: #fffaf5; border: none; border-radius: 18px; box-shadow: 0 6px 16px rgba(74, 59, 92, .18); padding: 10px 22px; font-size: clamp(14px, 2.4vw, 22px); font-weight: bold; color: #4a3b5c; white-space: nowrap; transition: opacity .3s; pointer-events: none; }
  .guide.hide { opacity: 0; }
  .guide.nudge { animation: nudge .45s ease-out; }
  @keyframes nudge { 0%, 100% { transform: translateX(-50%) scale(1); } 40% { transform: translateX(-50%) scale(1.12); } }
  #toast { position: fixed; z-index: 60; left: 50%; top: 14px; transform: translate(-50%, -30px); background: #fff; border: 3px solid #3bb273; border-radius: 14px; padding: 10px 18px; font-size: clamp(13px, 2.6vw, 18px); font-weight: bold; opacity: 0; pointer-events: none; transition: opacity .26s, transform .26s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* panels (pet picker and the weight card) */
  .overlay { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(43, 35, 64, .25); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .panel { background: #fff; border-radius: 28px; box-shadow: 0 12px 34px rgba(40, 90, 60, .25); display: flex; flex-direction: column; padding: 12px 16px 16px; transform: scale(.94); transition: transform .25s ease-out; }
  .overlay.open .panel { transform: none; }
  .pk-panel { width: 94%; height: 90%; }
  .pk-head { display: flex; align-items: center; justify-content: center; position: relative; min-height: 52px; }
  .panel h3 { margin: 0; font-size: clamp(18px, 3vw, 28px); color: #3bb273; text-align: center; }
  .pk-close { position: absolute; right: 0; top: 0; width: 48px; height: 48px; border: none; border-radius: 50%; background: #e7f6ed; display: flex; align-items: center; justify-content: center; }
  .pk-close:hover { background: #d3efdf; }
  .pk-close svg { width: 22px; height: 22px; }
  .pk-body { flex: 1; min-height: 0; display: flex; align-items: center; gap: 12px; }
  .pk-window { flex: 1; height: 100%; overflow: hidden; }
  .pk-strip { display: flex; height: 100%; transition: transform .45s ease-in-out; }
  .pk-page { flex: 0 0 100%; height: 100%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 12px; padding: 6px; }
  .pk-card { position: relative; min-height: 0; border: none; border-radius: 22px; background: #eaf7ef; display: flex; align-items: flex-end; justify-content: center; padding: 8px 8px 46px; transition: transform .15s, box-shadow .15s; }
  .pk-card img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
  .pk-card:not(.empty):hover, .pk-card:not(.empty):focus-visible { transform: translateY(-4px); box-shadow: 0 0 0 5px #fff6b0, 0 8px 18px rgba(40, 90, 60, .2); outline: none; }
  .pk-card.empty { background: #f4f8f5; cursor: default; align-items: center; }
  .pk-card.empty svg { width: 38%; max-height: 60%; opacity: .25; }
  .pk-name { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: #fff; border: 3px solid #8a5a3b; border-radius: 999px; padding: 4px 14px; font-size: clamp(11px, 1.6vw, 16px); font-weight: bold; color: #6b4329; white-space: nowrap; }
  .pk-card.empty .pk-name { border-color: #c9d6cd; color: #9aaba0; }
  .pk-next { flex: 0 0 auto; width: 64px; height: 64px; border: none; border-radius: 50%; background: #3d8fe0; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #2a6db3; transition: transform .15s; }
  .pk-next:hover { transform: scale(1.06); }
  .pk-next:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a6db3; }
  .pk-next:disabled { opacity: .35; cursor: default; transform: none; }
  .pk-next svg { width: 30px; height: 30px; }
  /* the weight card: the weight, and how much food that means (the same card comes back when you measure food) */
  .wt-panel { width: min(92%, 640px); max-height: 92%; align-items: center; gap: 10px; padding: 18px 20px 20px; }
  .wt-big { font-size: clamp(30px, 6vw, 52px); font-weight: bold; color: #2b6e47; }
  .wt-chart { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .wt-col { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 10px; border-radius: 18px; background: #f4f8f5; font-size: 13px; color: #7d9a88; font-weight: bold; min-width: 88px; }
  .wt-col svg { width: 54px; height: 64px; }
  .wt-col.me { background: #fff8d6; box-shadow: 0 0 0 4px #f2c14e; color: #6b4329; }
  .wt-col b { font-size: 17px; }
  .ok { margin-top: 6px; min-width: 140px; height: 54px; padding: 0 30px; border: none; border-radius: 999px; background: #3bb273; color: #fff; font-size: 20px; font-weight: bold; box-shadow: 0 4px 0 #2a8a55; }
  .ok:hover { background: #35a468; }
  .ok:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a8a55; }
  @media (max-width: 600px) { .pk-next { width: 48px; height: 48px; } .pk-page { gap: 8px; } .pk-card { padding-bottom: 38px; } .wt-col { min-width: 64px; padding: 6px; } .wt-col svg { width: 40px; height: 48px; } }

  /* ---------- measuring food ---------- */
  .ms-panel { width: 94%; height: 92%; padding: 10px 16px 14px; }
  .ms-stage { flex: 1; min-height: 0; width: 100%; touch-action: none; }
  .ms-bar { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 60px; flex-wrap: wrap; }
  .ms-say { font-size: clamp(14px, 2.3vw, 21px); font-weight: bold; color: #4a3b5c; text-align: center; max-width: 640px; }
  .ms-top { margin: 4px auto 0; min-height: 2.6em; display: block; }   /* the words sit above the cup */
  .ms-btn { min-height: 52px; padding: 0 22px; border: none; border-radius: 999px; background: #3bb273; color: #fff; font-size: 18px; font-weight: bold; box-shadow: 0 4px 0 #2a8a55; display: flex; align-items: center; gap: 8px; }
  .ms-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a8a55; }
  .ms-btn.soft { background: #fff; color: #6b4329; border: 3px solid #c9a27f; box-shadow: 0 4px 0 #e2cdb8; }
  .ms-btn.soft.on { box-shadow: 0 0 0 5px #fff6b0, 0 4px 0 #e2cdb8; }
  .ms-btn[hidden] { display: none; }
  .ms-bin, .ms-bowl { cursor: pointer; }
  .ms-bin .lid { transition: transform .3s; transform-box: fill-box; transform-origin: 100% 100%; }
  .ms-bin .tilt { transition: transform .35s ease-in-out; transform-box: view-box; transform-origin: 70px 470px; }
  .ms-bin.pour .tilt { transform: rotate(-16deg); }
  .ms-bin.pour .lid { transform: rotate(35deg); }
  .kib { opacity: 0; }
  .pouring .kib { animation: fall .5s linear infinite; }
  @keyframes fall { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 1; transform: translate(var(--dx), var(--dy)); } }
  .ms-line .lbl { opacity: 0; transition: opacity .3s; }
  .ms-line.show .lbl { opacity: 1; }
  .ms-line .glow { opacity: 0; transition: opacity .25s; }
  .ms-line.goal .glow { opacity: 1; }
  .ms-cup { transition: transform .6s ease-in-out; transform-box: view-box; transform-origin: 520px 300px; }
  .ms-cup.tip { transform: rotate(-70deg); }   /* tips toward the bowl and pours from the lip */
  .ms-cup.wiggle { animation: shake .47s; }
  .ms-cup .ms-line { transition: opacity .2s; }
  .ms-cup.tip .ms-line { opacity: 0; }
  .bowlfood { transition: opacity .4s; }
  .extra { transition: opacity .4s; pointer-events: none; }
  #msBinWrap, #msBowl { transition: opacity .3s; }
  .away { opacity: 0; pointer-events: none; }
  .ms-bin.on .ring, .ms-cup.on .ring { opacity: 1; }
  .ms-cup.on { cursor: grab; }
  .ms-cup.tip .ring { opacity: 0; }
  .kib2 { animation: fall2 .45s linear infinite; }
  @keyframes fall2 { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(-6px, 70px); opacity: 1; } }
  .wb { outline: none; }
  .wb.drag { cursor: grab; }
  .wb.drag .ring { opacity: 1; }
  #room:has(.tgt:hover) .wb .ring { opacity: 0; }
  .task.blink { cursor: pointer; border-color: #f2c14e; animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  .stink { animation: stink 2.4s ease-in-out infinite; }
  @keyframes stink { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  #btStink { transition: opacity .3s; }
  .bt-head { cursor: grab; }
  .ms-bin:hover .ring, .ms-bowl:hover .ring { opacity: .75; }

  /* ---------- bath ---------- */
  .bt-panel { width: 94%; height: 92%; padding: 10px 16px 14px; }
  .bt-steps { display: flex; gap: 8px; justify-content: center; }
  .bt-steps .task { height: 46px; font-size: 16px; }
  .bt-steps .task.cur { height: 58px; font-size: 20px; }
  .bt-steps .task svg { width: 30px; height: 30px; }
  .bt-steps .task.cur svg { width: 40px; height: 40px; }
  .bt-tool { cursor: grab; }
  .bt-tool .ring { opacity: 0; transition: opacity .15s; }
  .bt-tool.on .ring { opacity: 1; }
  .bt-tool:hover .ring { opacity: .75; }
  .bt-tool.used { opacity: .35; cursor: default; }
  .bt-shower { cursor: pointer; }
  .bt-shower .ring { opacity: 0; transition: opacity .15s; }
  .bt-shower.on .ring { opacity: 1; }
  .bt-shower.on:hover .ring { opacity: .75; }
  .mud, .bub { transition: opacity .35s; }
  .puff { animation: puff .5s ease-out forwards; }
  @keyframes puff { from { opacity: .9; } to { opacity: 0; transform: translateY(-14px); } }
  .rain { opacity: 0; }
  .raining .rain { animation: rain .45s linear infinite; }
  @keyframes rain { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 1; transform: translate(-60px, 150px); } }
  .burst polygon { transform-box: fill-box; transform-origin: center; animation: burst .8s ease-out forwards; }
  @keyframes burst { 0% { opacity: 0; transform: translate(0, 0) scale(.3); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--bx), var(--by)) scale(1); } }
  .done-panel { width: min(90%, 520px); align-items: center; gap: 12px; padding: 22px; }
  #allDone { align-items: flex-start; padding-top: 2%; background: rgba(43, 35, 64, .08); }   /* high up, so the happy pet shows below */

  /* ---------- one button style everywhere (like Dress Up's trash can and All Done):
     rounded corners, a solid color, and a darker shadow along the bottom that presses in when tapped ---------- */
  .ok, .ms-btn, .pk-close, .pk-next { border: none; border-radius: 16px; font-weight: bold; transition: transform .1s, box-shadow .1s; }
  .ok, .ms-btn { min-height: 54px; padding: 0 30px; background: #3bb273; color: #fff; font-size: 20px; box-shadow: 0 5px 0 #2a8a55; }
  .ms-btn.soft { background: #4a9be0; color: #fff; border: none; box-shadow: 0 5px 0 #3479b8; }
  .ms-btn.soft.on { box-shadow: 0 5px 0 #3479b8, 0 0 0 6px #fff6b0; }
  .ms-btn.soft svg ellipse, .ms-btn.soft svg rect { fill: #fff; }
  .pk-close { width: 52px; height: 52px; background: #5f5a6b; box-shadow: 0 5px 0 #46424f; }
  .pk-close svg path { stroke: #fff; }
  .pk-close:hover { background: #6b6678; }
  .pk-next { width: 64px; height: 64px; background: #4a9be0; box-shadow: 0 5px 0 #3479b8; }
  .ok:active, .ms-btn:active, .pk-close:active, .pk-next:active { transform: translateY(4px); }
  .ok:active, .ms-btn:active { box-shadow: 0 1px 0 #2a8a55; }
  .ms-btn.soft:active { box-shadow: 0 1px 0 #3479b8; }
  .pk-close:active { box-shadow: 0 1px 0 #46424f; }
  .pk-next:active { box-shadow: 0 1px 0 #3479b8; }
  .pk-next:hover, .ok:hover { filter: brightness(1.05); }
  @media (max-width: 980px) { .backtown .back-words { display: none; } .backtown { padding: 0 10px; } }   /* room for the task list */
  /* a pet's card: grows out of its picture; boy or girl as a blue or pink paw; weight is a blank you find by weighing */
  .pk-info { position: absolute; inset: 8px; z-index: 4; background: #fff; border-radius: 24px; box-shadow: 0 10px 30px rgba(74, 59, 92, .2); display: flex; align-items: center; gap: 28px; padding: 22px 30px; transform: scale(.2); opacity: 0; transition: transform .3s cubic-bezier(.3, 1.3, .5, 1), opacity .2s; }
  .pk-info.open { transform: none; opacity: 1; }
  .pi-pic { flex: 0 0 auto; height: min(100%, 360px); max-width: 45%; object-fit: contain; background: #eaf7ef; border-radius: 22px; padding: 12px; }
  .pi-body { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .pi-name { margin: 0; font-size: clamp(28px, 4.5vw, 44px); color: #4a3b5c; }
  .pi-facts { display: flex; flex-direction: column; gap: 10px; font-size: clamp(16px, 2.4vw, 22px); color: #4a3b5c; }
  .pi-row { display: flex; align-items: center; }
  .pi-paw svg { width: 34px; height: 32px; margin-right: 10px; display: block; }
  .pi-blank { display: inline-block; width: 64px; border-bottom: 3px solid #6b5a80; height: 1.1em; }
  .pi-btns { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
  @media (max-width: 600px) { .pk-info { flex-direction: column; gap: 10px; padding: 14px; } .pi-pic { height: 34%; max-width: 80%; } }
</style>
</head>
<body>
<!-- ===== loading screen (paste right after <body> in any big game; follows style-guide.md) =====
     Shows while the game's pictures download. Change the words in .ld-words for each game.
     At the very end of the game's last script, add:  hideLoading();                         -->
<div id="loading" role="status" aria-live="polite">
  <style>
    #loading { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(160deg, #fff4e6 0%, #ffe3ef 50%, #e3f2ff 100%); font-family: Verdana, Geneva, sans-serif; transition: opacity .35s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .ld-dots { display: flex; gap: 12px; }
    #loading .ld-dots i { width: 18px; height: 18px; border-radius: 50%; animation: ldHop .9s ease-in-out infinite; }
    #loading .ld-dots i:nth-child(1) { background: #e0457b; }
    #loading .ld-dots i:nth-child(2) { background: #ffc94d; animation-delay: .15s; }
    #loading .ld-dots i:nth-child(3) { background: #7b5cd6; animation-delay: .3s; }
    #loading .ld-words { margin: 0; font-size: 22px; font-weight: bold; color: #e0457b; }
    @keyframes ldHop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px); } }
    @media (prefers-reduced-motion: reduce) { #loading .ld-dots i { animation: none; } }
  </style>
  <div class="ld-dots"><i></i><i></i><i></i></div>
  <p class="ld-words">Getting the pets ready...</p>
</div>
<script>
  function hideLoading() {
    const l = document.getElementById('loading');
    if (!l) return;
    l.classList.add('done'); setTimeout(() => l.remove(), 400);
  }
</script>
<!-- ===== end loading screen ===== -->

<!-- ===== toolbar (same on every screen; paste right after <body>; follows style-guide.md) ===== -->
<style>
  #tb { position: fixed; right: 12px; bottom: 12px; z-index: 40; display: flex; align-items: flex-end; gap: 12px;
    padding: 11px 11px 11px 13px; background: #fff; border-radius: 28px;
    box-shadow: 0 0 0 2px #f3edf8, 0 10px 30px rgba(120, 60, 120, .18); font-family: Verdana, Geneva, sans-serif;
    animation: tbIn .525s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes tbIn { from { transform: translateY(130%); } to { transform: none; } }
  #tb button { font-family: inherit; border: none; -webkit-tap-highlight-color: transparent; }
  #tb .tb-btn { position: relative; width: 64px; height: 64px; padding: 8px; border-radius: 20px; background: #f3edf8; cursor: pointer;
    box-shadow: 0 4px 0 #ddd0ec; transition: transform .126s, box-shadow .126s, background .21s; }
  #tb .tb-btn svg, #tb .tb-btn .tb-ic { width: 100%; height: 100%; display: block; transition: transform .21s; }
  #tb .tb-btn .tb-ic { object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
  #tb .tb-btn:hover svg, #tb .tb-btn:focus-visible svg, #tb .tb-btn:hover .tb-ic, #tb .tb-btn:focus-visible .tb-ic { transform: translateY(-3px) rotate(-6deg); }
  #tb .tb-btn:active, #tb .tb-me:active { transform: translateY(4px); box-shadow: 0 0 0 #ddd0ec; }
  #tb .tb-btn.here { background: #ffe8f0; box-shadow: 0 4px 0 #f5bcd0; }
  #tb .tb-btn.wiggle svg, #tb .tb-btn.wiggle .tb-ic { animation: tbWiggle .525s; }
  @keyframes tbWiggle { 20% { transform: rotate(-14deg); } 40% { transform: rotate(11deg); } 60% { transform: rotate(-7deg); } 80% { transform: rotate(4deg); } }
  #tb .tb-btn .tb-lock { position: absolute; right: -8px; top: -8px; width: 27px; height: 27px; filter: drop-shadow(0 2px 3px rgba(74, 59, 92, .25)); }
  #tb .tb-me { position: relative; width: 96px; height: 128px; margin-top: -58px; padding: 7px; border-radius: 20px; cursor: pointer;
    background: linear-gradient(#fff 55%, #ffe8f0); box-shadow: 0 4px 0 #f5bcd0, 0 8px 18px rgba(74, 59, 92, .15);
    transition: transform .126s, box-shadow .126s; }
  #tb .tb-me img, #tb .tb-me svg { width: 100%; height: 100%; display: block; object-fit: contain; }
  #tb .tb-me [hidden] { display: none; }
  #tb .tb-me img, #tb .tb-me svg { transition: transform .21s; }
  #tb .tb-me:hover img, #tb .tb-me:focus-visible img, #tb .tb-me:hover svg, #tb .tb-me:focus-visible svg { transform: translateY(-3px) rotate(-6deg); }
  #tb .tb-me.stamp { animation: tbStamp .693s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes tbStamp { 0% { transform: scale(1); } 30% { transform: scale(1.28, .78); } 60% { transform: scale(.92, 1.12); } 100% { transform: scale(1); } }
  .tb-spark { position: fixed; width: 14px; height: 14px; z-index: 96; pointer-events: none;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: tbSpark .84s ease-out forwards; }
  @keyframes tbSpark { from { transform: translate(0, 0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(90deg); opacity: 0; } }
  #tb .tb-panel { position: absolute; right: 80px; bottom: calc(100% + 16px); display: grid; grid-template-columns: repeat(3, 64px); gap: 10px;
    padding: 14px; background: #fff; border-radius: 22px; box-shadow: 0 0 0 2px #f3edf8, 0 10px 30px rgba(120, 60, 120, .18);
    transform: translateY(16px) scale(.6); transform-origin: 70% 100%; opacity: 0; pointer-events: none; transition: transform .263s cubic-bezier(.3, 1.5, .5, 1), opacity .21s; }
  #tb .tb-panel.open { transform: none; opacity: 1; pointer-events: auto; }
  #tb .tb-slot { width: 64px; height: 64px; border-radius: 16px; background: #f8f4fc; box-shadow: inset 0 3px 6px rgba(120, 60, 120, .08); display: flex; align-items: center; justify-content: center; }
  #tb .tb-slot svg { width: 22px; height: 22px; opacity: .5; }
  @media (max-width: 600px) {
    #tb { right: 8px; bottom: 8px; gap: 6px; padding: 7px 7px 7px 8px; border-radius: 22px; }
    #tb .tb-btn { width: 52px; height: 52px; padding: 6px; border-radius: 16px; }
    #tb .tb-me { width: 76px; height: 102px; margin-top: -46px; padding: 6px; }
    #tb .tb-panel { right: 0; grid-template-columns: repeat(3, 56px); } #tb .tb-slot { width: 56px; height: 56px; }
  }
  @media (prefers-reduced-motion: reduce) { #tb, #tb .tb-me.stamp, #tb .tb-btn.wiggle svg, #tb .tb-btn.wiggle .tb-ic { animation: none !important; } }

<script data-root="../">
// Toolbar: house, backpack, boutique, and your doll. Saved in the browser so it follows you around town.
(function () {
  const ROOT = document.currentScript.dataset.root, KEY = 'myTown.v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  window.tbData = data;
  window.tbSave = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  const $ = id => document.getElementById(id);
  const STAR = '<svg viewBox="0 0 24 24"><polygon points="12,2 14.9,8.6 22,9.2 16.6,13.9 18.2,21 12,17.3 5.8,21 7.4,13.9 2,9.2 9.1,8.6" fill="#ddd0ec"/></svg>';
  $('tbPanel').innerHTML = Array(6).fill('<div class="tb-slot">' + STAR + '</div>').join('');   // empty for now: things to collect
  function render() {
    const has = !!data.avatar;
    $('tbMeImg').hidden = !has; $('tbEmpty').hidden = has;
    if (has) $('tbMeImg').src = data.avatar;
  }
  let ac;
  function beep(notes, type) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime;
      notes.forEach(([f, d, l]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type || 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.14, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + l);
        o.connect(g).connect(ac.destination); o.start(t + d); o.stop(t + d + l + .05);
      });
    } catch (e) {}
  }
  window.tbBeep = beep;
  window.tbSparkle = (el, n) => {
    const r = el.getBoundingClientRect(), cols = ['#ffc94d', '#e0457b', '#7b5cd6', '#3bb273', '#4a9be0'];
    for (let i = 0; i < (n || 14); i++) {
      const s = document.createElement('div'), a = Math.random() * 6.28, d = 45 + Math.random() * 55;
      s.className = 'tb-spark'; s.style.background = cols[i % cols.length];
      s.style.left = (r.left + r.width / 2 - 7) + 'px'; s.style.top = (r.top + r.height / 2 - 7) + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(s); setTimeout(() => s.remove(), 893);
    }
  };
  window.tbSetAvatar = (url, extra) => {
    data.avatar = url; Object.assign(data, extra || {}); tbSave(); render();
    const b = $('tbMe'); b.classList.remove('stamp'); void b.offsetWidth; b.classList.add('stamp');
    tbSparkle(b, 18);
  };
  function wiggle(b) { b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); }
  $('tbMe').onclick = () => { beep([[659, 0, .12], [988, .08, .2]]); if (window.tbOnMe && tbOnMe()) return;
    // the doll opens Dress Up from anywhere; All Done brings you back to this screen (the Boutique's wardrobe does not)
    location.href = ROOT + 'dress-up/dress-up.html?back=' + encodeURIComponent(location.href); };
  $('tbTown').onclick = () => { beep([[392, 0, .12], [523, .08, .2]]); if (window.tbOnTown && tbOnTown()) return; location.href = ROOT + 'index.html#town'; };
  $('tbHome').onclick = () => { wiggle($('tbHome')); beep([[330, 0, .15], [262, .12, .2]], 'sine'); };
  $('tbBag').onclick = e => {
    e.stopPropagation(); wiggle($('tbBag'));
    const open = $('tbPanel').classList.toggle('open');
    beep(open ? [[440, 0, .1], [660, .07, .15]] : [[660, 0, .1], [440, .07, .15]]);
  };
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#tbPanel') && !e.target.closest('#tbBag')) $('tbPanel').classList.remove('open'); });
  render();
})();
</script>

function drawTasks(popCur) {

function tagSvg(t) {

const ringSvg = (x, y, w, h) => `<rect class="ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="40" fill="rgba(255,246,176,.18)" stroke="#fff6b0" stroke-width="14"/>`;

function drawRoom() {
  let s = `<image href="${ART.room}" x="0" y="0" width="1984" height="1116"/><g id="extras">${extrasSvg()}</g>`;
  for (const [id, t] of Object.entries(TARGETS)) {

function setTask(i, quiet) {
  task = i;
  const t = TASKS[task];   // after the last task there is none: everything is done
  drawTasks(!quiet);
  const doneT = TASKS.slice(0, Math.min(task, TASKS.length)).flatMap(x => x.targets).concat(fed ? ['food'] : [], watered ? ['water'] : []);
  room.querySelectorAll('.tgt').forEach(g => g.classList.toggle('done', doneT.includes(g.dataset.t)));
  const pickTime = task === 0;   // picking a pet: an arrow points at the crates instead of a glow
  room.querySelectorAll('.tgt').forEach(g => { const mine = !!t && t.targets.includes(g.dataset.t); g.classList.toggle('on', mine && !pickTime); g.classList.toggle('named', mine && pickTime); });
  document.getElementById('pickArrow').style.display = pickTime ? '' : 'none';
  const pg = document.querySelector('.petg');
  if (pg) pg.classList.toggle('drag', !!t && (t.icon === 'scale' || t.icon === 'bubbles'));   // drag the pet to the scale or the tub
  guide(t ? say(t.guide) : `${pet.name} is all clean and happy.`);
}

const guideEl = document.getElementById('guide');
function guide(text) {
  if (!guideEl.textContent) { guideEl.textContent = text; return; }
  guideEl.classList.add('hide');
  setTimeout(() => { guideEl.textContent = text; guideEl.classList.remove('hide'); }, 250);
}

function nudgeGuide() {   // a little bounce on the line that already says what to do
  guideEl.classList.remove('nudge'); void guideEl.offsetWidth; guideEl.classList.add('nudge');
  const a = document.getElementById('pickArrow'); if (a && a.style.display !== 'none') { a.classList.remove('nudge'); void a.getBBox(); a.classList.add('nudge'); }
}
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

function useTarget(g) {
  if (busy) return;
  const id = g.dataset.t;
  if (g.classList.contains('done')) return;   // already done
  if (!TASKS[task]) return;
  const allowed = TASKS[task].targets.includes(id) || (id === 'water' && fed && !watered);
  if (!allowed) return id === 'water' && TASKS[task].icon === 'bowl' && !fed ? showToast(`Feed ${pet.name} first!`) : nudgeGuide();   // not this one yet
  if (id === 'dogs' || id === 'cats') return openPicker(id === 'dogs' ? 'dog' : 'cat');
  if (id === 'scale') return weigh();
  if (id === 'food') return fed ? null : openMeasure();
  if (id === 'water') return fillWater();
  if (id === 'bath') return openBath();
  g.classList.remove('shake'); void g.getBBox(); g.classList.add('shake');   // not built yet
  setTimeout(() => g.classList.remove('shake'), 500);
  showToast(`${TARGETS[id].name}: coming soon`);
}

const picker = document.getElementById('picker'), strip = document.getElementById('pkStrip'), nextBtn = document.getElementById('pkNext');
const EMPTY_PAW = `<svg viewBox="-24 -26 48 48">${ICONS.paw.replace(/#8a5a3b/g, '#3bb273')}</svg>`;
function openOverlay(el) { el.classList.add('open'); el.setAttribute('aria-hidden', 'false'); }
function closeOverlay(el) { el.classList.remove('open'); el.setAttribute('aria-hidden', 'true'); }

function openPicker(k) {
  kind = k; page = 0;
  const list = PETS[k], pages = Math.max(1, Math.ceil(list.length / 8));
  document.getElementById('pkTitle').textContent = k === 'dog' ? 'Pick a dog' : 'Pick a cat';
  let s = '';
  for (let p = 0; p < pages; p++) {
    s += '<div class="pk-page">';
    for (let i = p * 8; i < p * 8 + 8; i++) {
      const a = list[i];
      s += a ? `<button class="pk-card" data-pet="${a.id}" aria-label="${a.name}"><img src="${ART[a.art]}" alt=""><span class="pk-name">${a.name}</span></button>`
             : `<div class="pk-card empty" aria-hidden="true">${EMPTY_PAW}<span class="pk-name">Coming soon</span></div>`;
    }
    s += '</div>';
  }
  strip.innerHTML = s;
  strip.style.transition = 'none'; strip.style.transform = 'translateX(0)'; void strip.offsetWidth; strip.style.transition = '';
  nextBtn.disabled = pages < 2;
  openOverlay(picker);
}

nextBtn.addEventListener('click', () => {
  const pages = strip.children.length;

// ---------- A pet's card: grows out of its picture in the picker ----------

function choosePet(a) {

// ---------- Weigh: drag the pet onto the scale (or tap the scale) ----------
function petMove(dx, dy, k, ms) {
  const g = document.querySelector('.petg');
  g.style.transition = ms ? `transform ${ms}ms ease-in-out` : 'none';
  g.style.transformOrigin = `${RUG.cx}px ${RUG.bottom}px`;
  g.style.transform = `translate(${dx}px, ${dy}px) scale(${k})`;
}
function svgPoint(e) {
  const p = room.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(room.getScreenCTM().inverse());
}
let drag = null;
room.addEventListener('pointerdown', e => {
  const g = e.target.closest('.petg.drag');
  if (!g || busy) return;
  drag = { start: svgPoint(e), moved: false, dx: 0, dy: 0 }; g.classList.add('dragging');
  room.setPointerCapture(e.pointerId);
});
room.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = svgPoint(e), dx = p.x - drag.start.x, dy = p.y - drag.start.y;
  if (Math.hypot(dx, dy) > 8) drag.moved = true;
  petMove(dx, dy, 1, 0);
  drag.dx = dx; drag.dy = dy;
  const spot = petDropSpot(dx, dy);   // close enough: go there now, no need to let go
  if (spot) { drag = null; document.querySelector('.petg').classList.remove('dragging'); spot === 'scale' ? weigh() : (petMove(0, 0, 1, 0), openBath()); }
});
// Drag and drop rule for the whole game: a drop counts when it is within SNAP of the target (in room units),
// and the thing snaps into place as soon as it gets there.
const SNAP = 45;
const near = (t, x, y, below = SNAP) => x > t.x - SNAP && x < t.x + t.w + SNAP && y > t.y - SNAP && y < t.y + t.h + below;
function petDropSpot(dx, dy) {
  const fx = RUG.cx + dx, fy = RUG.bottom + dy, t = TASKS[task];   // where the pet's feet are
  if (t && t.icon === 'scale' && near(TARGETS.scale, fx, fy, 160)) return 'scale';
  if (t && t.icon === 'bubbles' && near(TARGETS.bath, fx, fy, 160)) return 'bath';
  return null;
}
room.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  document.querySelector('.petg').classList.remove('dragging');
  if (!d.moved) return;
  const spot = petDropSpot(d.dx, d.dy);
  if (spot === 'scale') weigh();
  else if (spot === 'bath') { petMove(0, 0, 1, 0); openBath(); }
  else petMove(0, 0, 1, 350);   // not on the right spot: back to the rug
});

function weigh() {
  if (busy || TASKS[task].icon !== 'scale') return;
  busy = true;
  document.querySelector('.petg').classList.remove('drag');
  room.querySelector('[data-t="scale"]').classList.remove('on');
  guideEl.classList.add('hide');
  petMove(ON_SCALE.cx - RUG.cx, ON_SCALE.bottom - RUG.bottom, ON_SCALE.k, 600);
  const ro = document.getElementById('readout'), num = document.getElementById('readNum');
  num.textContent = '0 lb';
  setTimeout(() => {
    ro.classList.add('show');
    let n = 0; const steps = 12;
    const tick = setInterval(() => {
      n++; num.textContent = `${Math.round(pet.weight * n / steps)} lb`;
      if (n >= steps) { clearInterval(tick); setTimeout(showWeightCard, 450); }
    }, 55);
  }, 650);
}

function cupSvg(cups) {
  // a glass measuring cup with lines at 1/4, 1/2, 3/4 and 1 cup, filled with food to this much
  const top = 12, bot = 74, fillY = bot - (bot - top) * cups;
  let lines = '';
  for (const q of [.25, .5, .75, 1]) { const y = bot - (bot - top) * q; lines += `<rect x="12" y="${y - 1.5}" width="12" height="3" rx="1.5" fill="#7aa6c8"/>`; }
  return `<svg viewBox="0 0 64 80"><rect x="8" y="6" width="44" height="70" rx="10" fill="#e6f2fb"/>
    <rect x="8" y="${fillY}" width="44" height="${bot - fillY + 2}" rx="${cups === 1 ? 10 : 4}" fill="#c98a5a"/>
    <circle cx="20" cy="${fillY + 8}" r="3" fill="#a86d43"/><circle cx="34" cy="${fillY + 12}" r="3" fill="#a86d43"/>
    ${lines}<path d="M52 22 h6 a6 6 0 0 1 6 6 v18 a6 6 0 0 1 -6 6 h-6" fill="none" stroke="#e6f2fb" stroke-width="6"/></svg>`;
}

function showWeightCard() {

document.getElementById('wtOk').addEventListener('click', () => {
  closeOverlay(document.getElementById('weightCard'));

// ---------- Food and water ----------
// Measuring: a short look at the measuring cup, then hold the food bin to pour and let go at the pet's line.
// The bowl only shows up when the food is just right; then drag the cup to the bowl and hold it there to pour.
// After eating, drag the empty water bowl to the sink to fill it.
const POUR_RATE = .12;     // cups per second while holding the bin (1 cup takes about 8 seconds)
const CLOSE_ENOUGH = .045; // how near the line counts as just right
// Layout (1100 wide): the bowl on the left (the cup's lip faces it), the cup in the middle, the food bin on the right.
const CUP = { x: 340, y: 150, w: 360, h: 307, y0: 404, y1: 228, left0: 410, left1: 382, right0: 578, right1: 596 };
const CUP_C = [520, 300];                 // the cup turns around its middle when it pours
const MS_BOWL = { x: 40, y: 360, w: 180 };
const BOWL_OPEN = { cx: .53, cy: .30, rx: .35, ry: .18 };   // the bowl's opening, as parts of the bowl picture
const EAT = { h: 330, cx: 1010, nose: [.15, .86] };       // the eating picture on the rug, and where its nose is
const FLOOR_BOWL = 157.5;                                 // bowls on the floor (5% bigger than before)
let ms = null, fed = false, watered = false;

const cupY = c => CUP.y0 - (CUP.y0 - CUP.y1) * c;
function cupInside(c) {   // the glass's inside from the bottom up to c cups (it is a little wider at the top)
  const y = cupY(c), t = (CUP.y0 - y) / (CUP.y0 - CUP.y1);
  const l = CUP.left0 + (CUP.left1 - CUP.left0) * t, r = CUP.right0 + (CUP.right1 - CUP.right0) * t;
  return `M${CUP.left0},${CUP.y0 - 10} Q${CUP.left0 + 8},${CUP.y0 + 4} ${(CUP.left0 + CUP.right0) / 2},${CUP.y0 + 5} Q${CUP.right0 - 8},${CUP.y0 + 4} ${CUP.right0},${CUP.y0 - 10} L${r},${y} Q${(l + r) / 2},${y - 6} ${l},${y} Z`;
}
function kibbleDots(c) {
  let s = '';
  if (c <= 0) return s;
  const top = cupY(c);
  for (let i = 0; i < 26; i++) {
    const y = CUP.y0 - 10 - ((i * 37) % 100) / 100 * (CUP.y0 - 10 - top), x = CUP.left0 + 16 + ((i * 53) % (CUP.right0 - CUP.left0 - 32));
    if (y > top + 6) s += `<circle cx="${x}" cy="${y}" r="5" fill="#a86d43"/>`;
  }
  return s;
}

function binSvg() {
  return `<g class="ms-bin" id="msBin" role="button" tabindex="0" aria-label="Food bin, hold to pour" transform="translate(760 0)">
    ${ringSvg(40, 70, 290, 420)}
    <g class="tilt">
      <rect x="70" y="150" width="230" height="320" rx="34" fill="#e3eef0"/>
      <path d="M78 250 Q120 232 160 250 T240 248 T292 250 V440 Q292 462 270 462 H100 Q78 462 78 440 Z" fill="#b98557"/>
      <circle cx="120" cy="300" r="7" fill="#9a6a42"/><circle cx="190" cy="340" r="7" fill="#9a6a42"/><circle cx="245" cy="290" r="7" fill="#9a6a42"/><circle cx="150" cy="400" r="7" fill="#9a6a42"/><circle cx="230" cy="410" r="7" fill="#9a6a42"/>
      <rect x="92" y="170" width="22" height="270" rx="11" fill="#fff" opacity=".45"/>
      <g class="lid"><rect x="58" y="118" width="254" height="44" rx="20" fill="#c4a690"/><rect x="160" y="96" width="50" height="30" rx="14" fill="#b39581"/></g>
    </g>
    ${[0, 1, 2, 3, 4, 5].map(i => `<circle class="kib" cx="60" cy="${150 + i * 4}" r="${7 - (i % 3)}" fill="#a86d43" style="--dx:${-300 - i * 10}px;--dy:${110 + i * 16}px;animation-delay:${i * .08}s"/>`).join('')}
  </g>`;
}

function drawMeasure() {
  const lines = [.25, .5, .75, 1], bh = MS_BOWL.w * 236 / 360;
  let s = `<g id="msBinWrap" class="away">${binSvg()}</g>`;
  s += `<g id="msBowl" class="away"><image href="${ART.bowlFood}" x="${MS_BOWL.x}" y="${MS_BOWL.y}" width="${MS_BOWL.w}" height="${bh}"/>
    <ellipse id="msBowlFood" cx="${MS_BOWL.x + MS_BOWL.w * BOWL_OPEN.cx}" cy="${MS_BOWL.y + bh * BOWL_OPEN.cy}" rx="${MS_BOWL.w * BOWL_OPEN.rx * .9}" ry="${bh * BOWL_OPEN.ry * .9}" fill="#b98557" opacity="0"/></g>`;
  s += `<g id="msCupMove"><g class="ms-cup" id="msCup" role="button" tabindex="0" aria-label="Measuring cup">
    ${ringSvg(CUP.x - 4, CUP.y - 10, CUP.w + 8, CUP.h + 20)}
    <image href="${ART.cup}" x="${CUP.x}" y="${CUP.y}" width="${CUP.w}" height="${CUP.h}"/>
    <g opacity=".88"><path id="msFood" d="" fill="#c98a5a"/><g id="msDots"></g></g>`;
  lines.forEach(c => {
    const y = cupY(c), t = (CUP.y0 - y) / (CUP.y0 - CUP.y1), l = CUP.left0 + (CUP.left1 - CUP.left0) * t;
    s += `<g class="ms-line" data-c="${c}">
      <rect class="glow" x="${l - 6}" y="${y - 9}" width="86" height="18" rx="9" fill="#fff6b0"/>
      <rect x="${l + 4}" y="${y - 3}" width="66" height="6" rx="3" fill="#4f86b8"/>
      <g class="lbl"><rect x="${l - 112}" y="${y - 17}" width="96" height="34" rx="17" fill="#fff" stroke="#4f86b8" stroke-width="4"/>
      <text x="${l - 64}" y="${y + 8}" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f6390">${CUPS[c]}</text></g></g>`;
  });
  s += `</g></g><g id="msStream"></g>`;
  document.getElementById('msStage').innerHTML = s;
  setCup(0);
}
function setCup(c) {
  ms.amount = Math.max(0, Math.min(1.12, c));
  document.getElementById('msFood').setAttribute('d', ms.amount > 0 ? cupInside(ms.amount) : '');
  document.getElementById('msDots').innerHTML = kibbleDots(ms.amount);
}
const msSay = t => { document.getElementById('msSay').innerHTML = t; };
function msButtons(next, spoon) {
  const n = document.getElementById('msNext'), sp = document.getElementById('msSpoon');
  n.hidden = !next; if (next) n.textContent = next;
  sp.hidden = !spoon; sp.classList.toggle('on', spoon === 'on');
}
const msShow = (id, on) => document.getElementById(id).classList.toggle('away', !on);

function openMeasure() {
  hideExtra('shelfFood');   // the bowl comes off the shelf
  ms = { step: 0, amount: 0, pouring: false, done: false, ready: false, drag: null };
  document.getElementById('msTitle').textContent = `Measure ${pet.name}'s food`;
  drawMeasure();
  openOverlay(document.getElementById('measure'));
  lessonStep();
}
const MS_VIEW = { full: [0, 0, 1100, 520], cup: [190, 120, 660, 360] };
function msView(to, ms_) {   // move the measuring screen's view smoothly (bigger cup at first)
  const st = document.getElementById('msStage'), from = (st.getAttribute('viewBox') || '').split(' ').map(Number);
  if (!ms_ || from.length !== 4) return st.setAttribute('viewBox', to.join(' '));
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms_), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    st.setAttribute('viewBox', from.map((v, i) => v + (to[i] - v) * e).join(' ')); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function lessonStep() {
  const goal = CUPS[pet.food];
  if (ms.step === 0) {   // just the cup first, big
    msView(MS_VIEW.cup);
    document.querySelectorAll('.ms-line').forEach((g, i) => setTimeout(() => g.classList.add('show'), 300 + i * 250));
    msSay('This is a measuring cup. The lines show how much food is inside.');
    msButtons('Next');
  } else {               // then the food bin, and the line to fill to
    msView(MS_VIEW.full, 500);
    document.querySelector(`.ms-line[data-c="${pet.food}"]`).classList.add('goal');
    msShow('msBinWrap', true);
    document.getElementById('msBin').classList.add('on');
    msSay(`${pet.name} needs <b>${goal}</b>. Hold the food bin to pour, and let go at the ${goal} line.`);
    msButtons(null);
  }
}
document.getElementById('msNext').addEventListener('click', () => { ms.step++; lessonStep(); });
document.getElementById('msClose').addEventListener('click', () => { stopPour(); closeOverlay(document.getElementById('measure')); });

function startPour(e) {
  if (!ms || ms.step < 1 || ms.done || ms.pouring) return;
  if (e) e.preventDefault();
  ms.pouring = true; ms.last = performance.now();
  ready(false);
  document.getElementById('msBin').classList.add('pour');
  document.getElementById('msStage').classList.add('pouring');
  requestAnimationFrame(pourTick);
}
function pourTick(t) {
  if (!ms || !ms.pouring) return;
  setCup(ms.amount + POUR_RATE * (t - ms.last) / 1000); ms.last = t;
  requestAnimationFrame(pourTick);
}
function stopPour() {
  if (!ms || !ms.pouring) return;
  ms.pouring = false;
  document.getElementById('msBin').classList.remove('pour');
  document.getElementById('msStage').classList.remove('pouring');
  judge();
}
// is the food at the line? Only then does the bowl show up.
function judge() {
  const goal = CUPS[pet.food], diff = ms.amount - pet.food;
  if (ms.amount <= 0) { ready(false); msButtons(null); msSay(`Hold the food bin to pour, and let go at the ${goal} line.`); return; }
  if (Math.abs(diff) <= CLOSE_ENOUGH) {
    ready(true); msButtons(null);
    msSay(`Just right! Now drag the cup to the bowl and hold it there to pour.`);
  } else if (diff < 0) {
    ready(false); msButtons(null);   // no spoon when there is too little
    msSay(`A little more. Pour up to the ${goal} line.`);
  } else {
    ready(false); msButtons(null, 'on');
    msSay(`Too much. Take some out with the spoon.`);
  }
}
function ready(on) {
  ms.ready = on;
  msShow('msBowl', on);
  document.getElementById('msCup').classList.toggle('on', on);
  document.getElementById('msBin').classList.toggle('on', !on && !ms.done);
}
const stage = document.getElementById('msStage');
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#msBin')) { stage.setPointerCapture(e.pointerId); return startPour(e); }
  if (e.target.closest('#msCup') && ms && ms.ready && !ms.done) {   // pick up the cup
    e.preventDefault();
    const p = msPoint(e);
    ms.drag = { sx: p.x, sy: p.y, dx: 0, dy: 0 };
    document.getElementById('msCupMove').style.transition = 'none';
    stage.setPointerCapture(e.pointerId);
    ms.last = performance.now(); requestAnimationFrame(pourOutTick);
  }
});
stage.addEventListener('pointermove', e => {
  if (!ms || !ms.drag) return;
  const p = msPoint(e), d = ms.drag;
  d.dx = p.x - d.sx; d.dy = p.y - d.sy;
  // anywhere near the bowl counts; then the cup snaps so its lip is right over the bowl and the food lands in it
  const cx = CUP_C[0] + d.dx, cy = CUP_C[1] + d.dy, bcx = MS_BOWL.x + MS_BOWL.w / 2;
  d.over = cx > bcx + 10 && cx < bcx + 340 && cy > MS_BOWL.y - 360 && cy < MS_BOWL.y + 160;
  const mv = document.getElementById('msCupMove');
  let tx = d.dx, ty = d.dy;
  if (d.over) { tx = bcx + 10 + 158 - CUP_C[0]; ty = MS_BOWL.y - 28 - 113 - CUP_C[1]; }
  mv.style.transition = d.over ? 'transform .18s ease-out' : 'none';
  mv.style.transform = `translate(${tx}px, ${ty}px)`;
  document.getElementById('msCup').classList.toggle('tip', d.over);
  d.lip = [CUP_C[0] + tx - 158, CUP_C[1] + ty + 113];   // where the lip is once the cup tips
});
function dropCup() {
  if (!ms) return;
  stopPour();
  if (!ms.drag) return;
  ms.drag = null;
  if (ms.done) return;
  const mv = document.getElementById('msCupMove');
  document.getElementById('msCup').classList.remove('tip');
  document.getElementById('msStream').innerHTML = '';
  mv.style.transition = 'transform .35s'; mv.style.transform = 'translate(0px, 0px)';
  if (ms.amount < pet.food - CLOSE_ENOUGH && ms.amount > 0) msSay('Keep the cup over the bowl until all the food is in.');
}
stage.addEventListener('pointerup', dropCup);
stage.addEventListener('pointercancel', dropCup);
function msPoint(e) {
  const p = stage.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(stage.getScreenCTM().inverse());
}
const BOWL_FILL = .45;   // cups per second out of the cup while it is tipped over the bowl
function pourOutTick(t) {
  if (!ms || !ms.drag || ms.done) return;
  const d = ms.drag, dt = (t - ms.last) / 1000; ms.last = t;
  const stream = document.getElementById('msStream');
  if (d.over && ms.amount > 0) {
    setCup(ms.amount - BOWL_FILL * dt);
    document.getElementById('msBowlFood').setAttribute('opacity', Math.min(1, 1 - ms.amount / pet.food));
    if (!stream.innerHTML) stream.innerHTML = [0, 1, 2, 3, 4].map(i =>
      `<circle class="kib2" cx="${d.lip[0] + (i % 2) * 8}" cy="${d.lip[1]}" r="${6 - (i % 3)}" fill="#a86d43" style="animation-delay:${i * .07}s"/>`).join('');
    else stream.querySelectorAll('circle').forEach((c, i) => { c.setAttribute('cx', d.lip[0] + (i % 2) * 8); c.setAttribute('cy', d.lip[1]); });
    if (ms.amount <= 0) return foodInBowl();
  } else stream.innerHTML = '';
  requestAnimationFrame(pourOutTick);
}
function foodInBowl() {
  ms.done = true; ms.drag = null;
  document.getElementById('msStream').innerHTML = '';
  document.getElementById('msBowlFood').setAttribute('opacity', 1);
  document.getElementById('msCup').classList.remove('on');
  msSay(`Just right! That's ${CUPS[pet.food]} of food for ${pet.name}.`);
  setTimeout(() => {
    closeOverlay(document.getElementById('measure'));
    feedPet();
  }, 1200);
}
document.getElementById('msSpoon').addEventListener('click', () => { setCup(ms.amount - .05); judge(); });
stage.addEventListener('keydown', e => { if (e.target.closest('#msBin') && (e.key === 'Enter' || e.key === ' ')) startPour(e); });
stage.addEventListener('keyup', e => { if (e.target.closest('#msBin')) stopPour(); });

// in the room: the bowl goes in front of the pet and it eats
function feedPet() {
  fed = true;
  room.querySelector('[data-t="food"]').classList.remove('on');
  const EH = eatH(), left = EAT.cx - EH * 647 / 440 / 2, top = RUG.bottom - EH;
  const nx = left + EH * 647 / 440 * EAT.nose[0], ny = top + EH * EAT.nose[1];
  // the bowl goes behind the pet, and a copy of its front rim goes in front, so the face dips into the bowl
  const bw = FLOOR_BOWL, bh = bw * 236 / 360, bx = nx - bw / 2 - 10, by = ny - bh * BOWL_OPEN.cy - 16;
  const ocy = by + bh * BOWL_OPEN.cy, ory = bh * BOWL_OPEN.ry;
  const layer = document.getElementById('petLayer');
  layer.insertAdjacentHTML('afterbegin', `<g id="foodBowl" class="bowlfood"><image href="${ART.bowlFood}" x="${bx}" y="${by}" width="${bw}" height="${bh}"/>
    <ellipse id="bowlKib" cx="${bx + bw * BOWL_OPEN.cx}" cy="${ocy}" rx="${bw * BOWL_OPEN.rx * .85}" ry="${ory * .8}" fill="#b98557"/></g>`);
  layer.insertAdjacentHTML('beforeend', `<g id="foodRim" class="bowlfood" clip-path="url(#rimClip)"><clipPath id="rimClip"><rect x="${bx - 5}" y="${ocy + ory * .55}" width="${bw + 10}" height="${bh}"/></clipPath>
    <image href="${ART.bowlFood}" x="${bx}" y="${by}" width="${bw}" height="${bh}"/></g>`);
  setPose('eat');
  guide(`${pet.name} is eating.`);
  busy = true;
  setTimeout(() => { document.getElementById('bowlKib').setAttribute('opacity', 0); }, 2600);
  setTimeout(() => {
    setPose('sit');
    ['foodBowl', 'foodRim'].forEach(id => { const fb = document.getElementById(id); fb.style.opacity = 0; setTimeout(() => fb.remove(), 450); });
    busy = false; waterTime();
  }, 3200);
}
function setPose(p) {
  const img = document.querySelector('.petg image'), ring = document.querySelector('.petg .ring');
  if (p === 'eat') {
    const EH = eatH(), w = EH * 647 / 440;
    img.setAttribute('href', ART[pet.eat]); img.setAttribute('x', EAT.cx - w / 2); img.setAttribute('y', RUG.bottom - EH);
    img.setAttribute('width', w); img.setAttribute('height', EH);
  } else {
    const h = rugH(), w = h * 443 / 560;
    img.setAttribute('href', ART[pet.art]); img.setAttribute('x', RUG.cx - w / 2); img.setAttribute('y', RUG.bottom - h);
    img.setAttribute('width', w); img.setAttribute('height', h);
  }
  ring.style.display = 'none';
}

// water: after eating, an empty bowl sits by the pet; drag it to the sink (or tap the sink) and it fills
const WB = { x: 1180, bottom: RUG.bottom + 12 }, SINK_SPOT = { cx: 1512, bottom: 506, k: .7 };   // in the basin, under the faucet
const SINK_FRONT = 'M1386 503 L1608 503 L1608 560 L1386 560 Z';   // the sink's front edge, drawn over the bowl
function waterTime() {
  hideExtra('shelfWater');
  const bw = FLOOR_BOWL, bh = bw * 236 / 360, x = WB.x, y = WB.bottom - bh;
  const cx = x + bw * BOWL_OPEN.cx, cy = y + bh * BOWL_OPEN.cy, rx = bw * BOWL_OPEN.rx * .85, ry = bh * BOWL_OPEN.ry * .8;
  document.getElementById('petLayer').insertAdjacentHTML('afterbegin', `<g id="waterBowl" class="wb drag" role="button" tabindex="0" aria-label="Water bowl, drag it to the sink">
    ${ringSvg(x - 18, y - 18, bw + 36, bh + 36)}
    <image href="${ART.bowlWater}" x="${x}" y="${y}" width="${bw}" height="${bh}"/>
    <ellipse id="wbWater" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#8fd0f5" style="transform-box: fill-box; transform-origin: center; transform: scale(0); transition: transform .9s ease-out"/>
    <ellipse id="wbShine" cx="${cx - rx * .35}" cy="${cy - ry * .25}" rx="${rx * .25}" ry="${ry * .2}" fill="#fff" opacity="0" style="transition: opacity .4s .6s"/></g>`);
  room.querySelector('[data-t="water"]').classList.add('on');
  guide(`Drag the water bowl to the sink.`);
}
function wbMove(dx, dy, ms_, k = 1) {
  const g = document.getElementById('waterBowl');
  g.style.transition = ms_ ? `transform ${ms_}ms ease-in-out` : 'none';
  g.style.transformOrigin = `${WB.x + FLOOR_BOWL / 2}px ${WB.bottom}px`;
  g.style.transform = `translate(${dx}px, ${dy}px) scale(${k})`;
}
let wdrag = null;
room.addEventListener('pointerdown', e => {
  const g = e.target.closest('.wb.drag');
  if (!g || busy || watered) return;
  wdrag = { start: svgPoint(e), dx: 0, dy: 0 };
  room.setPointerCapture(e.pointerId);
});
room.addEventListener('pointermove', e => {
  if (!wdrag) return;
  const p = svgPoint(e); wdrag.dx = p.x - wdrag.start.x; wdrag.dy = p.y - wdrag.start.y;
  wbMove(wdrag.dx, wdrag.dy, 0);
  if (atSink(wdrag.dx, wdrag.dy)) { const d = wdrag; wdrag = null; fillWater(d.dx, d.dy); }   // no need to let go
});
function atSink(dx, dy) {
  const cx = WB.x + FLOOR_BOWL / 2 + dx, by = WB.bottom + dy, s = TARGETS.water;
  return near(s, cx, by, 70);   // a little less eager than before
}
room.addEventListener('pointerup', () => {
  if (!wdrag) return;
  const d = wdrag; wdrag = null;
  if (atSink(d.dx, d.dy)) fillWater(d.dx, d.dy);
  else wbMove(0, 0, 350);   // not at the sink: back by the pet
});
function fillWater(fromDx, fromDy) {
  if (watered || busy || !fed) return;
  busy = true;
  const g = document.getElementById('waterBowl'); g.classList.remove('drag');
  room.querySelector('[data-t="water"]').classList.remove('on');
  guideEl.classList.add('hide');
  const bw = FLOOR_BOWL, tx = SINK_SPOT.cx - (WB.x + bw / 2), ty = SINK_SPOT.bottom - WB.bottom;
  if (fromDx !== undefined) wbMove(fromDx, fromDy, 0);
  requestAnimationFrame(() => wbMove(tx, ty, 450, SINK_SPOT.k));   // down into the sink, under the faucet
  setTimeout(() => {   // the sink's front edge goes in front of the bowl, water runs and the bowl fills
    document.getElementById('sinkFront').style.opacity = 1;
    room.insertAdjacentHTML('beforeend', `<rect id="faucetWater" x="${SINK_SPOT.cx - 5}" y="424" width="10" height="34" rx="5" fill="#8fd0f5" opacity=".9"/>`);
    document.getElementById('wbWater').style.transform = 'scale(1)';
    document.getElementById('wbShine').setAttribute('opacity', .7);
  }, 500);
  setTimeout(() => { const f = document.getElementById('faucetWater'); if (f) f.remove(); document.getElementById('sinkFront').style.opacity = 0; wbMove(0, 0, 600); }, 1600);   // back by the pet
  setTimeout(() => {
    watered = true; busy = false;
    showToast(`Fresh water for ${pet.name}`);
    setTask(3);
  }, 2300);
}

// ---------- Bath ----------
// In the tub: rub the soap on the pet (bubbles, and the stinky lines go away), move the shower over the pet to rinse,
// rub the towel to dry, then brush. You can keep going as long as you like; when a step is done the next one blinks.
const POSES = {   // the sitting pictures at the same scale (560 = the sitting pose's height), lined up by the paws
  sit:  { art: p => p.art,  w: 443, h: 560, dx: 0 },
  bath: { art: p => p.bath, w: 464, h: 580, dx: 10 },
  done: { art: p => p.done, w: 452, h: 560, dx: 4 },
};
const TUB_DOG = { cx: 560, bottom: 470, h: 380 };   // the pet in the tub (sitting height), its paws hidden by the tub
const TUB = { x: 230, w: 670 };                     // the tub reaches the shower pipe at x 900
const SHOWER_HOME = [858, 232];                     // where the shower head hangs
const SPRAY = [-.6, .8];                            // which way the water sprays from the head (down and to the left)
const BATH_STEPS = [
  { id: 'soap',  name: 'Soap',  say: n => `Rub the soap on ${n}.`, ok: n => '' },
  { id: 'rinse', name: 'Rinse', say: n => `Rinse off the bubbles.`, ok: n => '' },
  { id: 'towel', name: 'Dry',   say: n => `Dry ${n} with the towel.`, ok: n => '' },
  { id: 'brush', name: 'Brush', say: n => `Brush ${n}'s fur.`, ok: n => '' },
];
const RUB_DONE = .7;   // how much of the pet you have to rub
let bt = null;

function poseBox(pose, cx, bottom, sitH) {
  const P = POSES[pose], k = sitH / 560;
  return { x: cx - P.w * k / 2 + P.dx * k, y: bottom - P.h * k, w: P.w * k, h: P.h * k };
}
function poseImg(pose) {
  const b = poseBox(pose, TUB_DOG.cx, TUB_DOG.bottom, tubH());
  return `<image id="btDog" href="${ART[POSES[pose].art(pet)]}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`;
}

// which parts of the pet can be rubbed: a grid over the picture, keeping only squares where the pet is
function petCells(artKey, box, cols, rows) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = 60; c.height = 76;
      const g = c.getContext('2d'); g.drawImage(im, 0, 0, 60, 76);
      const d = g.getImageData(0, 0, 60, 76).data, cells = [];
      for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
        const px = Math.floor((q + .5) / cols * 60), py = Math.floor((r + .5) / rows * 76);
        if (d[(py * 60 + px) * 4 + 3] > 200 && r < rows * .75)   // the bottom part is inside the tub
          cells.push({ x: box.x + (q + .5) / cols * box.w, y: box.y + (r + .5) / rows * box.h, done: false });
      }
      res(cells);
    };
    im.src = ART[artKey];
  });
}

function bathStepsHtml() {
  const icons = { soap: 'bubbles', rinse: 'drop', towel: 'towel', brush: 'brush' };
  return BATH_STEPS.map((s, i) => {
    const done = i < bt.step, cur = i === bt.step, next = bt.ready && i === bt.step + 1;
    return `<div class="task${cur ? ' cur' : ''}${done ? ' done' : ''}${next ? ' blink' : ''}" data-i="${i}"${next ? ' role="button" tabindex="0"' : ''}>${icon(done ? 'check' : icons[s.id])}<span>${s.name}</span></div>`;
  }).join('');
}

function tubSvg() {
  return `<g><rect x="${TUB.x}" y="360" width="${TUB.w}" height="40" rx="20" fill="#dfe7ee"/>
    <rect x="${TUB.x}" y="380" width="${TUB.w}" height="140" rx="44" fill="#f1f5f8"/>
    <rect x="${TUB.x + 40}" y="404" width="${TUB.w - 80}" height="12" rx="6" fill="#ffffff" opacity=".7"/></g>`;
}
function stinkSvg(box) {   // three wavy "stinky" lines rising beside the pet's head
  const top = box.y + box.h * .12, l = box.x + box.w * .05, r = box.x + box.w * .95;
  const wave = (x, y) => `<path class="stink" d="M${x} ${y} q-14 -18 0 -36 q14 -18 0 -36 q-14 -18 0 -36" fill="none" stroke="#9cb36b" stroke-width="7" stroke-linecap="round"/>`;
  return `<g id="btStink">${wave(l - 20, top + 60)}${wave(l + 30, top + 10)}${wave(r - 10, top + 30)}${wave(r + 30, top + 80)}</g>`;
}
function showerSvg() {
  // the shower: a pipe on the tub's right edge, a hose, and a hand shower you can pick up
  return `<rect x="900" y="110" width="22" height="290" rx="11" fill="#b7c0ca"/>
    <rect x="884" y="102" width="54" height="22" rx="11" fill="#9aa6b2"/>
    <path id="btHose" d="" fill="none" stroke="#a7b2bd" stroke-width="10" stroke-linecap="round"/>
    <g class="bt-tool bt-head" id="btHead" data-tool="rinse" role="button" tabindex="0" aria-label="Shower, move it over the pet to rinse">
      <circle class="ring" cx="40" cy="-50" r="105" fill="rgba(255,246,176,.18)" stroke="#fff6b0" stroke-width="12"/>
      <path d="M8 -12 L88 -122" stroke="#c9d3dc" stroke-width="26" stroke-linecap="round"/>
      <path d="M14 -20 L80 -110" stroke="#e8eef3" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="0" cy="0" rx="44" ry="24" fill="#b7c0ca" transform="rotate(37)"/>
      <ellipse cx="-6" cy="8" rx="34" ry="11" fill="#e3e9ee" transform="rotate(37)"/>
      <g class="spray">${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => {
        const side = (i % 3 - 1) * 16, sx = -6 + side * .8, sy = 12 + side * .6;
        return `<rect class="rain" x="${sx}" y="${sy}" width="7" height="22" rx="3.5" fill="#8fd0f5" style="animation-delay:${i * .05}s"/>`;
      }).join('')}</g>
    </g>`;
}
function setHead(x, y) {
  bt.head = [x, y];
  document.getElementById('btHead').setAttribute('transform', `translate(${x} ${y})`);
  const ex = x + 92, ey = y - 128;   // the end of the handle
  document.getElementById('btHose').setAttribute('d', `M911 398 C 990 470, ${ex + 120} ${ey + 60}, ${ex} ${ey}`);
}
function toolSvg(id, x, y, w) {
  const art = { soap: ART.soap, towel: ART.towel, brush: ART.brush }[id], h = w * TOOL_SIZE[id];
  return `<g class="bt-tool" id="bt-${id}" data-tool="${id}" role="button" tabindex="0" aria-label="${id}">
    ${ringSvg(x - 14, y - 14, w + 28, h + 28)}<image href="${art}" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
}
const TOOL_SIZE = { soap: 0, towel: 0, brush: 0 };   // height / width of each tool picture, filled in below
['soap', 'towel', 'brush'].forEach(k => { const im = new Image(); im.onload = () => { TOOL_SIZE[k] = im.height / im.width; }; im.src = ART[k]; });

async function openBath() {
  busy = true;
  bt = { step: 0, ready: false, cells: [], drag: null, bubbles: {} };
  const box = poseBox('sit', TUB_DOG.cx, TUB_DOG.bottom, tubH());
  bt.box = box;
  bt.cells = await petCells(pet.art, box, 7, 8);
  document.getElementById('btTitle').textContent = `${pet.name}'s bath`;
  document.getElementById('btStage').innerHTML = `
    <rect x="0" y="0" width="1100" height="520" fill="#f3fbf6" rx="20"/>
    <g id="btDogLayer">${poseImg('sit')}${stinkSvg(box)}<g id="btFx"></g></g>
    ${tubSvg()}
    ${showerSvg()}
    ${toolSvg('soap', 40, 70, 150)}${toolSvg('towel', 30, 220, 170)}${toolSvg('brush', 40, 370, 160)}
    <g id="btTop"></g>`;
  setHead(...SHOWER_HOME);
  openOverlay(document.getElementById('bath'));
  bathStep();
}

function bathStep() {
  const s = BATH_STEPS[bt.step], next = BATH_STEPS[bt.step + 1];
  document.getElementById('btSteps').innerHTML = bathStepsHtml();
  document.getElementById('btSay').textContent = !s ? '' : bt.ready ? s.ok(pet.name) : s.say(pet.name);
  document.querySelectorAll('.bt-tool').forEach(g => {
    const i = BATH_STEPS.findIndex(x => x.id === g.dataset.tool);
    g.classList.toggle('on', !!s && ((i === bt.step && !bt.ready) || (bt.ready && i === bt.step + 1)));
    g.classList.toggle('used', i < bt.step);
  });
}
function nextBathStep() {
  if (!bt.ready || bt.step >= BATH_STEPS.length - 1) return;
  bt.step++; bt.ready = false;
  bt.cells.forEach(c => c.done = false);
  document.querySelectorAll('#btFx .puff').forEach(p => p.remove());
  if (BATH_STEPS[bt.step].id === 'towel') document.querySelectorAll('#btFx .bub').forEach(b => b.remove());
  bathStep();
}
document.getElementById('btSteps').addEventListener('click', e => { if (e.target.closest('.task.blink')) nextBathStep(); });

const btStage = document.getElementById('btStage');
function btPoint(e) {
  const p = btStage.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(btStage.getScreenCTM().inverse());
}
btStage.addEventListener('pointerdown', e => {
  const t = e.target.closest('.bt-tool');
  if (!bt || !t) return;
  const i = BATH_STEPS.findIndex(x => x.id === t.dataset.tool);
  if (bt.ready && i === bt.step + 1) nextBathStep();   // picking up the next tool moves on
  if (i !== bt.step) return;
  e.preventDefault();
  const p = btPoint(e);
  if (t.id === 'btHead') {
    bt.drag = { head: true, ox: p.x - bt.head[0], oy: p.y - bt.head[1] };
    t.classList.add('raining');
  } else {
    const img = t.querySelector('image');
    bt.drag = { el: t, img, ox: p.x - +img.getAttribute('x'), oy: p.y - +img.getAttribute('y'), home: [img.getAttribute('x'), img.getAttribute('y')] };
    document.getElementById('btTop').appendChild(t);   // carry it over the pet
  }
  t.querySelector('.ring').style.display = 'none';
  btStage.setPointerCapture(e.pointerId);
});
btStage.addEventListener('pointermove', e => {
  if (!bt || !bt.drag) return;
  const p = btPoint(e), d = bt.drag;
  if (d.head) {   // the shower sprays down and to the left of the head
    setHead(p.x - d.ox, p.y - d.oy);
    return rubAt(bt.head[0] + SPRAY[0] * 120, bt.head[1] + SPRAY[1] * 120, 70);
  }
  const x = p.x - d.ox, y = p.y - d.oy;
  d.img.setAttribute('x', x); d.img.setAttribute('y', y);
  if (d.el.dataset.tool === 'brush') {   // turn the bristles toward the pet
    const w = +d.img.getAttribute('width'), h = +d.img.getAttribute('height'), cx = x + w * .3, cy = y + h * .35;
    const dogX = bt.box.x + bt.box.w / 2, dogY = bt.box.y + bt.box.h * .4;
    const a = Math.atan2(dogY - cy, dogX - cx) * 180 / Math.PI + 90;   // the bristles point up in the picture
    d.img.setAttribute('transform', `rotate(${a} ${cx} ${cy})`);
  }
  rubAt(p.x, p.y, 46);
});
function dropTool() {
  if (!bt || !bt.drag) return;
  const d = bt.drag; bt.drag = null;
  if (bt.brushEnd && BATH_STEPS[bt.step] && BATH_STEPS[bt.step].id === 'brush' && bt.ready) { clearTimeout(bt.brushEnd); bt.brushEnd = null; setTimeout(bathDone, 200); }
  if (d.head) {
    document.getElementById('btHead').classList.remove('raining');
    document.querySelector('#btHead .ring').style.display = '';
    return setHead(...SHOWER_HOME);   // back on its hook
  }
  d.img.setAttribute('x', d.home[0]); d.img.setAttribute('y', d.home[1]); d.img.removeAttribute('transform');
  d.el.querySelector('.ring').style.display = '';
}
btStage.addEventListener('pointerup', dropTool);
btStage.addEventListener('pointercancel', dropTool);

function rubAt(x, y, reach) {
  const step = BATH_STEPS[bt.step].id, fx = document.getElementById('btFx');
  let hit = false;
  bt.cells.forEach((c, i) => {
    if (c.done || Math.hypot(c.x - x, c.y - y) > reach) return;
    c.done = true; hit = true;
    if (step === 'soap') {
      const jx = (i * 37) % 23 - 11, jy = (i * 53) % 19 - 9, r = 15 + (i * 7) % 9;   // a little uneven, like real bubbles
      fx.insertAdjacentHTML('beforeend', `<g class="bub" data-cell="${i}"><circle cx="${c.x - 8 + jx}" cy="${c.y + jy}" r="${r}" fill="#fff" opacity=".92"/><circle cx="${c.x + 12 + jx}" cy="${c.y - 12 + jy}" r="${r * .6}" fill="#fff" opacity=".92"/><circle cx="${c.x - 12 + jx}" cy="${c.y - 6 + jy}" r="4" fill="#d7eefc"/></g>`);
    } else if (step === 'rinse') {
      fx.querySelectorAll(`.bub[data-cell="${i}"]`).forEach(b => { b.style.opacity = 0; setTimeout(() => b.remove(), 400); });
    } else {
      const col = step === 'towel' ? '#c8f0da' : '#fff6b0';
      fx.insertAdjacentHTML('beforeend', `<circle class="puff" cx="${c.x}" cy="${c.y}" r="16" fill="${col}"/>`);
    }
  });
  if (!hit) return;
  const part = bt.cells.filter(c => c.done).length / bt.cells.length;
  if (step === 'soap') { const st = document.getElementById('btStink'); if (st) st.style.opacity = Math.max(0, 1 - part / RUB_DONE); }
  if (!bt.ready && part >= RUB_DONE) stepReady(step);
}

function stepReady(step) {
  bt.ready = true;
  if (step === 'soap') { const st = document.getElementById('btStink'); if (st) st.remove(); }
  if (step === 'rinse') setDogPose('bath');
  if (step === 'towel') setDogPose('sit');
  if (step === 'brush') { bt.brushEnd = setTimeout(() => { bt.brushEnd = null; dropTool(); bathDone(); }, 3000); return bathStep(); }
  bathStep();
}
function setDogPose(pose) {
  document.getElementById('btDog').outerHTML = poseImg(pose);
}

function bathDone() {
  bt.step = BATH_STEPS.length; bt.ready = false; bathStep();
  setDogPose('done');
  document.getElementById('btSay').textContent = `${pet.name} is all clean.`;
  const b = poseBox('done', TUB_DOG.cx, TUB_DOG.bottom, tubH()), cx = b.x + b.w / 2, cy = b.y + b.h * .35;
  let stars = '';
  for (let i = 0; i < 8; i++) {   // one small burst of stars, once
    const a = i / 8 * Math.PI * 2;
    stars += `<polygon points="${starPts(cx, cy, 22, 9)}" fill="#ffd34d" style="--bx:${Math.cos(a) * 190}px;--by:${Math.sin(a) * 150}px"/>`;
  }
  document.getElementById('btFx').innerHTML = `<g class="burst">${stars}</g>`;
  setTimeout(() => {
    closeOverlay(document.getElementById('bath'));
    // back on the rug, happy
    const img = document.querySelector('.petg image'), rb = poseBox('done', RUG.cx, RUG.bottom, rugH());
    img.setAttribute('href', ART[pet.done]); img.setAttribute('x', rb.x); img.setAttribute('y', rb.y); img.setAttribute('width', rb.w); img.setAttribute('height', rb.h);
    busy = false; setTask(4);
    document.getElementById('adTitle').textContent = `${pet.name} is all done!`;
    document.getElementById('adSay').textContent = `You weighed, fed and bathed ${pet.name}. Great job!`;
    setTimeout(() => openOverlay(document.getElementById('allDone')), 700);
  }, 1600);
}
function starPts(cx, cy, R, r) {
  let p = [];
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R; p.push(`${cx + Math.cos(a) * rr},${cy + Math.sin(a) * rr}`); }
  return p.join(' ');
}
document.getElementById('btClose').addEventListener('click', () => { dropTool(); busy = false; closeOverlay(document.getElementById('bath')); });
document.getElementById('adAgain').addEventListener('click', () => {
  closeOverlay(document.getElementById('allDone'));
  pet = null; fed = false; watered = false;
  document.getElementById('petLayer').innerHTML = '';
  document.getElementById('extras').innerHTML = extrasSvg();   // everything back in its place
  setTask(0);
});

// ---------- Taps and keys ----------
room.addEventListener('click', e => { const g = e.target.closest('.tgt'); if (g) useTarget(g); });
room.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const g = e.target.closest('.tgt'), p = e.target.closest('.petg.drag');
  if (g || p) { e.preventDefault(); g ? useTarget(g) : TASKS[task].icon === 'bubbles' ? openBath() : weigh(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(picker); });

drawRoom();
setTask(0, true);
// coming from the town's crates: open that picker right away
if (location.hash === '#dog' || location.hash === '#cat') { openPicker(location.hash.slice(1)); history.replaceState(null, '', location.pathname); }   // only once


// ---------- go ----------
hideLoading();
</script>
</body>
</html>
