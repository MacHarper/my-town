<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vet Clinic</title>
<!-- My Town game starter (tools/make_game.py fills the {{...}} parts). Follows game-design and style-guide.md:
     one self-contained file, Verdana, mouse + touch, soft flat look, no outer outlines.
     Pictures go in the ART block below as data URLs so dress-up/tools/du.py can read and write them. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Verdana, Geneva, sans-serif; color: #2b2340; overflow-x: hidden;
    background: linear-gradient(160deg, #fff4e6 0%, #ffe3ef 50%, #e3f2ff 100%);
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }
  #game { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 10px 16px 96px; }
  header { width: 100%; max-width: 1000px; display: flex; align-items: center; gap: 12px; }
  header h2 { margin: 0; font-size: 26px; color: #3bb273; }
  .back { width: 56px; height: 48px; border: none; border-radius: 14px; background: #3bb273; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .back svg { width: 28px; height: 28px; }
  .back:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .play { flex: 1; width: 100%; max-width: 1000px; margin-top: 10px; min-height: 0; background: #fff; border-radius: 24px; box-shadow: 0 10px 30px rgba(120, 60, 120, .15); display: flex; align-items: center; justify-content: center; }
  .hello { font-size: 20px; color: #8a7a9c; animation: pop .4s backwards; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (max-width: 600px) { #game { padding: 8px 10px 100px; } header h2 { font-size: 20px; } .back { width: 48px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  /* ---------- Vet Clinic ---------- */
  .play { position: relative; overflow: hidden; background: #cdebd9; padding: 0; }
  #room { width: 100%; height: 100%; display: block; touch-action: none; }
  /* task list in the header: slides out once when you come in; the current task is the biggest */
  .tasks { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; animation: tasksIn .5s .3s ease-out backwards; }
  @keyframes tasksIn { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .task { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 5px; border: 3px solid #b9dcc6; border-radius: 999px; background: #fff; font-size: 14px; font-weight: bold; color: #7d9a88; }
  .task svg { width: 28px; height: 28px; flex: 0 0 auto; }
  .task.cur { height: 54px; padding: 0 18px 0 7px; border: 4px solid #3bb273; font-size: 19px; color: #2b6e47; }
  .task.cur svg { width: 40px; height: 40px; }
  .task.done { background: #e3f6ea; color: #6f9f80; }
  .task.pop { animation: popSoft .35s ease-out; }
  @keyframes popSoft { from { transform: scale(.85); opacity: .4; } to { transform: scale(1); opacity: 1; } }
  @media (max-width: 760px) { .task:not(.cur) span { display: none; } .task:not(.cur) { padding: 0 5px; } .task.cur { font-size: 15px; } }
  /* tap targets: a soft ring shows only when it is your turn to tap it, or while you hover right on it.
     While you hover one thing, only that thing lights up. */
  .tgt { cursor: pointer; outline: none; }
  .petg { outline: none; }
  .petg.drag { cursor: grab; }
  .petg.dragging { cursor: grabbing; }
  .ring, .tag { opacity: 0; transition: opacity .15s; }
  .tag { pointer-events: none; }
  .tgt:hover .ring, .tgt:focus-visible .ring { opacity: .75; }
  .tgt.on .ring, .petg.drag .ring { opacity: 1; }
  .tgt.on .tag, .tgt:hover .tag, .tgt:focus-visible .tag { opacity: 1; }
  #room:has(.tgt:hover, .petg.drag:hover) .tgt:not(:hover) .ring,
  #room:has(.tgt:hover, .petg.drag:hover) .tgt:not(:hover) .tag,
  #room:has(.tgt:hover) .petg .ring { opacity: 0; }
  .tgt.shake { animation: shake .47s; transform-box: fill-box; transform-origin: center; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .petg { transform-box: view-box; }
  .pet.in { animation: popSoft .4s ease-out; transform-box: fill-box; transform-origin: 50% 100%; }
  .readout { opacity: 0; transition: opacity .2s; pointer-events: none; }
  .readout.show { opacity: 1; }
  /* the guide: one short line that says what to do next */
  .guide { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; background: #fff; border: 4px solid #3bb273; border-radius: 999px; padding: 8px 20px; font-size: clamp(14px, 2.4vw, 22px); font-weight: bold; color: #2b6e47; white-space: nowrap; transition: opacity .3s; pointer-events: none; }
  .guide.hide { opacity: 0; }
  #toast { position: fixed; z-index: 60; left: 50%; top: 14px; transform: translate(-50%, -30px); background: #fff; border: 3px solid #3bb273; border-radius: 14px; padding: 10px 18px; font-size: clamp(13px, 2.6vw, 18px); font-weight: bold; opacity: 0; pointer-events: none; transition: opacity .26s, transform .26s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* panels (pet picker and the weight card) */
  .overlay { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(43, 35, 64, .25); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .panel { background: #fff; border-radius: 28px; box-shadow: 0 12px 34px rgba(40, 90, 60, .25); display: flex; flex-direction: column; padding: 12px 16px 16px; transform: scale(.94); transition: transform .25s ease-out; }
  .overlay.open .panel { transform: none; }
  .pk-panel { width: 94%; height: 90%; }
  .pk-head { display: flex; align-items: center; justify-content: center; position: relative; min-height: 52px; }
  .panel h3 { margin: 0; font-size: clamp(18px, 3vw, 28px); color: #3bb273; text-align: center; }
  .pk-close { position: absolute; right: 0; top: 0; width: 48px; height: 48px; border: none; border-radius: 50%; background: #e7f6ed; display: flex; align-items: center; justify-content: center; }
  .pk-close:hover { background: #d3efdf; }
  .pk-close svg { width: 22px; height: 22px; }
  .pk-body { flex: 1; min-height: 0; display: flex; align-items: center; gap: 12px; }
  .pk-window { flex: 1; height: 100%; overflow: hidden; }
  .pk-strip { display: flex; height: 100%; transition: transform .45s ease-in-out; }
  .pk-page { flex: 0 0 100%; height: 100%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 12px; padding: 6px; }
  .pk-card { position: relative; min-height: 0; border: none; border-radius: 22px; background: #eaf7ef; display: flex; align-items: flex-end; justify-content: center; padding: 8px 8px 46px; transition: transform .15s, box-shadow .15s; }
  .pk-card img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
  .pk-card:not(.empty):hover, .pk-card:not(.empty):focus-visible { transform: translateY(-4px); box-shadow: 0 0 0 5px #fff6b0, 0 8px 18px rgba(40, 90, 60, .2); outline: none; }
  .pk-card.empty { background: #f4f8f5; cursor: default; align-items: center; }
  .pk-card.empty svg { width: 38%; max-height: 60%; opacity: .25; }
  .pk-name { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: #fff; border: 3px solid #8a5a3b; border-radius: 999px; padding: 4px 14px; font-size: clamp(11px, 1.6vw, 16px); font-weight: bold; color: #6b4329; white-space: nowrap; }
  .pk-card.empty .pk-name { border-color: #c9d6cd; color: #9aaba0; }
  .pk-next { flex: 0 0 auto; width: 64px; height: 64px; border: none; border-radius: 50%; background: #3d8fe0; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #2a6db3; transition: transform .15s; }
  .pk-next:hover { transform: scale(1.06); }
  .pk-next:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a6db3; }
  .pk-next:disabled { opacity: .35; cursor: default; transform: none; }
  .pk-next svg { width: 30px; height: 30px; }
  /* the weight card: the weight, and how much food that means (the same card comes back when you measure food) */
  .wt-panel { width: min(92%, 640px); max-height: 92%; align-items: center; gap: 10px; padding: 18px 20px 20px; }
  .wt-big { font-size: clamp(30px, 6vw, 52px); font-weight: bold; color: #2b6e47; }
  .wt-chart { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .wt-col { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 10px; border-radius: 18px; background: #f4f8f5; font-size: 13px; color: #7d9a88; font-weight: bold; min-width: 88px; }
  .wt-col svg { width: 54px; height: 64px; }
  .wt-col.me { background: #fff8d6; box-shadow: 0 0 0 4px #f2c14e; color: #6b4329; }
  .wt-col b { font-size: 17px; }
  .ok { margin-top: 6px; min-width: 140px; height: 54px; border: none; border-radius: 999px; background: #3bb273; color: #fff; font-size: 20px; font-weight: bold; box-shadow: 0 4px 0 #2a8a55; }
  .ok:hover { background: #35a468; }
  .ok:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a8a55; }
  @media (max-width: 600px) { .pk-next { width: 48px; height: 48px; } .pk-page { gap: 8px; } .pk-card { padding-bottom: 38px; } .wt-col { min-width: 64px; padding: 6px; } .wt-col svg { width: 40px; height: 48px; } }

  /* ---------- measuring food ---------- */
  .ms-panel { width: 94%; height: 92%; padding: 10px 16px 14px; }
  .ms-stage { flex: 1; min-height: 0; width: 100%; touch-action: none; }
  .ms-bar { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 60px; flex-wrap: wrap; }
  .ms-say { font-size: clamp(14px, 2.3vw, 21px); font-weight: bold; color: #2b6e47; text-align: center; max-width: 640px; }
  .ms-btn { min-height: 52px; padding: 0 22px; border: none; border-radius: 999px; background: #3bb273; color: #fff; font-size: 18px; font-weight: bold; box-shadow: 0 4px 0 #2a8a55; display: flex; align-items: center; gap: 8px; }
  .ms-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a8a55; }
  .ms-btn.soft { background: #fff; color: #6b4329; border: 3px solid #c9a27f; box-shadow: 0 4px 0 #e2cdb8; }
  .ms-btn.soft.on { box-shadow: 0 0 0 5px #fff6b0, 0 4px 0 #e2cdb8; }
  .ms-btn[hidden] { display: none; }
  .ms-bin, .ms-bowl { cursor: pointer; }
  .ms-bin .lid { transition: transform .3s; transform-box: fill-box; transform-origin: 0% 100%; }
  .ms-bin .tilt { transition: transform .35s ease-in-out; transform-box: view-box; transform-origin: 300px 470px; }
  .ms-bin.pour .tilt { transform: rotate(16deg); }
  .ms-bin.pour .lid { transform: rotate(-35deg); }
  .kib { opacity: 0; }
  .pouring .kib { animation: fall .5s linear infinite; }
  @keyframes fall { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 1; transform: translate(var(--dx), var(--dy)); } }
  .ms-line .lbl { opacity: 0; transition: opacity .3s; }
  .ms-line.show .lbl { opacity: 1; }
  .ms-line .glow { opacity: 0; transition: opacity .25s; }
  .ms-line.goal .glow { opacity: 1; }
  .ms-cup { transition: transform .6s ease-in-out; transform-box: view-box; transform-origin: 610px 300px; }
  .ms-cup.tip { transform: translate(190px, 40px) rotate(70deg); }
  .ms-cup.wiggle { animation: shake .47s; }
  .bowlfood { transition: opacity .4s; }
  .ms-bin:hover .ring, .ms-bowl:hover .ring { opacity: .75; }
</style>
</head>
<body>
<!-- ===== loading screen (paste right after <body> in any big game; follows style-guide.md) =====
     Shows while the game's pictures download. Change the words in .ld-words for each game.
     At the very end of the game's last script, add:  hideLoading();                         -->
<div id="loading" role="status" aria-live="polite">
  <style>
    #loading { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(160deg, #fff4e6 0%, #ffe3ef 50%, #e3f2ff 100%); font-family: Verdana, Geneva, sans-serif; transition: opacity .35s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .ld-dots { display: flex; gap: 12px; }
    #loading .ld-dots i { width: 18px; height: 18px; border-radius: 50%; animation: ldHop .9s ease-in-out infinite; }
    #loading .ld-dots i:nth-child(1) { background: #e0457b; }
    #loading .ld-dots i:nth-child(2) { background: #ffc94d; animation-delay: .15s; }
    #loading .ld-dots i:nth-child(3) { background: #7b5cd6; animation-delay: .3s; }
    #loading .ld-words { margin: 0; font-size: 22px; font-weight: bold; color: #e0457b; }
    @keyframes ldHop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px); } }
    @media (prefers-reduced-motion: reduce) { #loading .ld-dots i { animation: none; } }
  </style>
  <div class="ld-dots"><i></i><i></i><i></i></div>
  <p class="ld-words">Getting the pets ready...</p>
</div>
<script>
  function hideLoading() {
    const l = document.getElementById('loading');
    if (!l) return;
    l.classList.add('done'); setTimeout(() => l.remove(), 400);
  }
</script>
<!-- ===== end loading screen ===== -->

<!-- ===== toolbar (same on every screen; paste right after <body>; follows style-guide.md) ===== -->
<style>
  #tb { position: fixed; right: 12px; bottom: 12px; z-index: 40; display: flex; align-items: flex-end; gap: 12px;
    padding: 11px 11px 11px 13px; background: #fff; border-radius: 28px;
    box-shadow: 0 0 0 2px #f3edf8, 0 10px 30px rgba(120, 60, 120, .18); font-family: Verdana, Geneva, sans-serif;
    animation: tbIn .525s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes tbIn { from { transform: translateY(130%); } to { transform: none; } }
  #tb button { font-family: inherit; border: none; -webkit-tap-highlight-color: transparent; }
  #tb .tb-btn { position: relative; width: 64px; height: 64px; padding: 8px; border-radius: 20px; background: #f3edf8; cursor: pointer;
    box-shadow: 0 4px 0 #ddd0ec; transition: transform .126s, box-shadow .126s, background .21s; }
  #tb .tb-btn svg, #tb .tb-btn .tb-ic { width: 100%; height: 100%; display: block; transition: transform .21s; }
  #tb .tb-btn .tb-ic { object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
  #tb .tb-btn:hover svg, #tb .tb-btn:focus-visible svg, #tb .tb-btn:hover .tb-ic, #tb .tb-btn:focus-visible .tb-ic { transform: translateY(-3px) rotate(-6deg); }
  #tb .tb-btn:active, #tb .tb-me:active { transform: translateY(4px); box-shadow: 0 0 0 #ddd0ec; }
  #tb .tb-btn.here { background: #ffe8f0; box-shadow: 0 4px 0 #f5bcd0; }
  #tb .tb-btn.wiggle svg, #tb .tb-btn.wiggle .tb-ic { animation: tbWiggle .525s; }
  @keyframes tbWiggle { 20% { transform: rotate(-14deg); } 40% { transform: rotate(11deg); } 60% { transform: rotate(-7deg); } 80% { transform: rotate(4deg); } }
  #tb .tb-btn .tb-lock { position: absolute; right: -8px; top: -8px; width: 27px; height: 27px; filter: drop-shadow(0 2px 3px rgba(74, 59, 92, .25)); }
  #tb .tb-me { position: relative; width: 96px; height: 128px; margin-top: -58px; padding: 7px; border-radius: 20px; cursor: pointer;
    background: linear-gradient(#fff 55%, #ffe8f0); box-shadow: 0 4px 0 #f5bcd0, 0 8px 18px rgba(74, 59, 92, .15);
    transition: transform .126s, box-shadow .126s; }
  #tb .tb-me img, #tb .tb-me svg { width: 100%; height: 100%; display: block; object-fit: contain; }
  #tb .tb-me [hidden] { display: none; }
  #tb .tb-me.stamp { animation: tbStamp .693s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes tbStamp { 0% { transform: scale(1); } 30% { transform: scale(1.28, .78); } 60% { transform: scale(.92, 1.12); } 100% { transform: scale(1); } }
  .tb-spark { position: fixed; width: 14px; height: 14px; z-index: 96; pointer-events: none;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: tbSpark .84s ease-out forwards; }
  @keyframes tbSpark { from { transform: translate(0, 0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(90deg); opacity: 0; } }
  #tb .tb-panel { position: absolute; right: 80px; bottom: calc(100% + 16px); display: grid; grid-template-columns: repeat(3, 64px); gap: 10px;
    padding: 14px; background: #fff; border-radius: 22px; box-shadow: 0 0 0 2px #f3edf8, 0 10px 30px rgba(120, 60, 120, .18);
    transform: translateY(16px) scale(.6); transform-origin: 70% 100%; opacity: 0; pointer-events: none; transition: transform .263s cubic-bezier(.3, 1.5, .5, 1), opacity .21s; }
  #tb .tb-panel.open { transform: none; opacity: 1; pointer-events: auto; }
  #tb .tb-slot { width: 64px; height: 64px; border-radius: 16px; background: #f8f4fc; box-shadow: inset 0 3px 6px rgba(120, 60, 120, .08); display: flex; align-items: center; justify-content: center; }
  #tb .tb-slot svg { width: 22px; height: 22px; opacity: .5; }
  @media (max-width: 600px) {
    #tb { right: 8px; bottom: 8px; gap: 6px; padding: 7px 7px 7px 8px; border-radius: 22px; }
    #tb .tb-btn { width: 52px; height: 52px; padding: 6px; border-radius: 16px; }
    #tb .tb-me { width: 76px; height: 102px; margin-top: -46px; padding: 6px; }
    #tb .tb-panel { right: 0; grid-template-columns: repeat(3, 56px); } #tb .tb-slot { width: 56px; height: 56px; }
  }
  @media (prefers-reduced-motion: reduce) { #tb, #tb .tb-me.stamp, #tb .tb-btn.wiggle svg, #tb .tb-btn.wiggle .tb-ic { animation: none !important; } }
</style>

<script data-root="../">
// Toolbar: house, backpack, boutique, and your doll. Saved in the browser so it follows you around town.
(function () {
  const ROOT = document.currentScript.dataset.root, KEY = 'myTown.v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  window.tbData = data;
  window.tbSave = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  const $ = id => document.getElementById(id);
  const STAR = '<svg viewBox="0 0 24 24"><polygon points="12,2 14.9,8.6 22,9.2 16.6,13.9 18.2,21 12,17.3 5.8,21 7.4,13.9 2,9.2 9.1,8.6" fill="#ddd0ec"/></svg>';
  $('tbPanel').innerHTML = Array(6).fill('<div class="tb-slot">' + STAR + '</div>').join('');   // empty for now: things to collect
  function render() {
    const has = !!data.avatar;
    $('tbMeImg').hidden = !has; $('tbEmpty').hidden = has;
    if (has) $('tbMeImg').src = data.avatar;
  }
  let ac;
  function beep(notes, type) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime;
      notes.forEach(([f, d, l]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type || 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.14, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + l);
        o.connect(g).connect(ac.destination); o.start(t + d); o.stop(t + d + l + .05);
      });
    } catch (e) {}
  }
  window.tbBeep = beep;
  window.tbSparkle = (el, n) => {
    const r = el.getBoundingClientRect(), cols = ['#ffc94d', '#e0457b', '#7b5cd6', '#3bb273', '#4a9be0'];
    for (let i = 0; i < (n || 14); i++) {
      const s = document.createElement('div'), a = Math.random() * 6.28, d = 45 + Math.random() * 55;
      s.className = 'tb-spark'; s.style.background = cols[i % cols.length];
      s.style.left = (r.left + r.width / 2 - 7) + 'px'; s.style.top = (r.top + r.height / 2 - 7) + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(s); setTimeout(() => s.remove(), 893);
    }
  };
  window.tbSetAvatar = (url, extra) => {
    data.avatar = url; Object.assign(data, extra || {}); tbSave(); render();
    const b = $('tbMe'); b.classList.remove('stamp'); void b.offsetWidth; b.classList.add('stamp');
    tbSparkle(b, 18);
  };
  function wiggle(b) { b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); }
  $('tbMe').onclick = () => { beep([[659, 0, .12], [988, .08, .2]]); if (window.tbOnMe && tbOnMe()) return; location.href = ROOT + 'dress-up/dress-up.html'; };
  $('tbTown').onclick = () => { beep([[392, 0, .12], [523, .08, .2]]); if (window.tbOnTown && tbOnTown()) return; location.href = ROOT + 'index.html#town'; };
  $('tbHome').onclick = () => { wiggle($('tbHome')); beep([[330, 0, .15], [262, .12, .2]], 'sine'); };
  $('tbBag').onclick = e => {
    e.stopPropagation(); wiggle($('tbBag'));
    const open = $('tbPanel').classList.toggle('open');
    beep(open ? [[440, 0, .1], [660, .07, .15]] : [[660, 0, .1], [440, .07, .15]]);
  };
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#tbPanel') && !e.target.closest('#tbBag')) $('tbPanel').classList.remove('open'); });
  render();
})();
</script>

// ---------- Saving: this game's own part of the shared save (myTown.v1 -> "vetClinic") ----------
const SAVE = {
  get(k, d) { const g = (window.tbData || {})['vetClinic'] || {}; return k in g ? g[k] : d; },
  set(k, v) { const t = window.tbData; if (!t) return; (t['vetClinic'] = t['vetClinic'] || {})[k] = v; tbSave(); },
};

// ---------- The game ----------

// The room picture is 1984 x 1116; everything on it uses those numbers.
// To add a pet: put its picture in ART, then add a line to PETS (its own name, never the breed; weight in pounds). The picker fills 8 a page.
const PETS = {
  dog: [ { id: 'ralphie', name: 'Ralphie', art: 'dachshundSit', eat: 'ralphieEat', weight: 16 } ],
  cat: [],
};
// How much food a pet gets for its weight. The weigh step shows this card, and the food step will
// ask the player to measure this much in the measuring cup (lines at 1/4, 1/2, 3/4 and 1 cup).
const FOOD = {
  dog: [ { upTo: 10, cups: .25, label: 'up to 10 lb' }, { upTo: 20, cups: .5, label: '11 to 20 lb' },
         { upTo: 40, cups: .75, label: '21 to 40 lb' }, { upTo: Infinity, cups: 1, label: 'over 40 lb' } ],
  cat: [ { upTo: 10, cups: .25, label: 'up to 10 lb' }, { upTo: Infinity, cups: .5, label: 'over 10 lb' } ],
};
const CUPS = { .25: '¼ cup', .5: '½ cup', .75: '¾ cup', 1: '1 cup' };
function foodFor(p, k) { return FOOD[k].find(r => p.weight <= r.upTo); }

// Places you can tap in the room
const TARGETS = {
  cats:  { name: 'Cats',      x: 205,  y: 240, w: 575, h: 222, tag: 'top' },
  dogs:  { name: 'Dogs',      x: 154,  y: 462, w: 680, h: 285, tag: 'bottom' },
  food:  { name: 'Food',      x: 1012, y: 332, w: 203, h: 387, tag: 'top' },
  scale: { name: 'Scale',     x: 1226, y: 672, w: 192, h: 86,  tag: 'bottom' },
  water: { name: 'Water',     x: 1379, y: 372, w: 228, h: 300, tag: 'top' },
  bath:  { name: 'Bath time', x: 1607, y: 342, w: 357, h: 437, tag: 'top' },
};
// The tasks, in order; the room parts for the current task are the ones that light up
const TASKS = [
  { name: 'Pick a pet', icon: 'paw',     targets: ['dogs', 'cats'],  guide: 'Pick a pet to care for!' },
  { name: 'Weigh',      icon: 'scale',   targets: ['scale'],         guide: 'Put your pet on the scale!' },
  { name: 'Food',       icon: 'bowl',    targets: ['food', 'water'], guide: 'Time for food and water!' },
  { name: 'Bath',       icon: 'bubbles', targets: ['bath'],          guide: 'Time for a bath!' },
];
const RUG = { cx: 992, bottom: 965, h: 400 };          // where the pet sits on the rug
const ON_SCALE = { cx: 1322, bottom: 726, k: .7 };      // where it sits on the scale, a little smaller

let task = 0, pet = null, kind = 'dog', page = 0, busy = false;
const room = document.getElementById('room');

const ICONS = {
  paw: `<ellipse cx="0" cy="8" rx="13" ry="11" fill="#8a5a3b"/><ellipse cx="-14" cy="-6" rx="5.5" ry="7" fill="#8a5a3b"/><ellipse cx="-5" cy="-15" rx="5.5" ry="7" fill="#8a5a3b"/><ellipse cx="6" cy="-15" rx="5.5" ry="7" fill="#8a5a3b"/><ellipse cx="15" cy="-6" rx="5.5" ry="7" fill="#8a5a3b"/>`,
  scale: `<rect x="-20" y="2" width="40" height="14" rx="5" fill="#8f98a3"/><rect x="-17" y="-1" width="34" height="8" rx="4" fill="#b7c0ca"/><rect x="-7" y="1" width="14" height="5" rx="2" fill="#dff3ff"/>`,
  bowl: `<path d="M-22 -2 H22 Q20 18 0 18 Q-20 18 -22 -2 Z" fill="#f28fb0"/><ellipse cx="0" cy="-2" rx="22" ry="6" fill="#f7b6cc"/><ellipse cx="0" cy="-4" rx="12" ry="3.5" fill="#c98a5a"/>`,
  bubbles: `<circle cx="-8" cy="6" r="11" fill="#bfe3fb"/><circle cx="10" cy="-4" r="9" fill="#d7eefc"/><circle cx="4" cy="14" r="6" fill="#a9d8f8"/><circle cx="-11" cy="2" r="3" fill="#fff"/>`,
  check: `<circle r="19" fill="#3bb273"/><path d="M-9 0 L-2 7 L10 -7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`,
};
const icon = k => `<svg viewBox="-24 -24 48 48">${ICONS[k]}</svg>`;
const say = text => text.replace('your pet', pet ? pet.name : 'your pet');

function drawTasks(popCur) {
  document.getElementById('tasks').innerHTML = TASKS.map((t, i) => {
    const done = i < task, cur = i === task;
    const words = done && t.icon === 'scale' && pet ? `${pet.weight} lb` : t.name;
    return `<div class="task${cur ? ' cur' : ''}${done ? ' done' : ''}${cur && popCur ? ' pop' : ''}">${icon(done ? 'check' : t.icon)}<span>${words}</span></div>`;
  }).join('');
}

function tagSvg(t) {
  const w = Math.max(120, t.name.length * 20 + 44), cx = t.x + t.w / 2;
  const y = t.tag === 'top' ? t.y - 58 : t.y + t.h - 6;
  return `<g class="tag"><rect x="${cx - w / 2}" y="${y}" width="${w}" height="48" rx="24" fill="#fff" stroke="#8a5a3b" stroke-width="4"/>
    <text x="${cx}" y="${y + 33}" text-anchor="middle" font-size="27" font-weight="bold" fill="#6b4329">${t.name}</text></g>`;
}
const ringSvg = (x, y, w, h) => `<rect class="ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="40" fill="rgba(255,246,176,.18)" stroke="#fff6b0" stroke-width="14"/>`;

function drawRoom() {
  let s = `<image href="${ART.room}" x="0" y="0" width="1984" height="1116"/>`;
  for (const [id, t] of Object.entries(TARGETS)) {
    s += `<g class="tgt" data-t="${id}" tabindex="0" role="button" aria-label="${t.name}">
      <rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" rx="40" fill="rgba(255,255,255,0)"/>
      ${ringSvg(t.x + 6, t.y + 6, t.w - 12, t.h - 12)}${tagSvg(t)}</g>`;
  }
  s += `<g id="petLayer"></g>
    <g class="readout" id="readout"><rect x="${ON_SCALE.cx - 95}" y="300" width="190" height="72" rx="36" fill="#fff" stroke="#3bb273" stroke-width="6"/>
      <text id="readNum" x="${ON_SCALE.cx}" y="350" text-anchor="middle" font-size="40" font-weight="bold" fill="#2b6e47"></text></g>`;
  room.innerHTML = s;
}

function setTask(i, quiet) {
  task = i;
  drawTasks(!quiet);
  room.querySelectorAll('.tgt').forEach(g => g.classList.toggle('on', TASKS[task].targets.includes(g.dataset.t)));
  const pg = document.querySelector('.petg');
  if (pg) pg.classList.toggle('drag', TASKS[task].icon === 'scale');
  guide(say(TASKS[task].guide));
}

const guideEl = document.getElementById('guide');
function guide(text) {
  if (!guideEl.textContent) { guideEl.textContent = text; return; }
  guideEl.classList.add('hide');
  setTimeout(() => { guideEl.textContent = text; guideEl.classList.remove('hide'); }, 250);
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

function useTarget(g) {
  if (busy) return;
  const id = g.dataset.t;
  if (!TASKS[task].targets.includes(id)) return showToast(say(TASKS[task].guide));   // not this one yet
  if (id === 'dogs' || id === 'cats') return openPicker(id === 'dogs' ? 'dog' : 'cat');
  if (id === 'scale') return weigh();
  if (id === 'food') return fed ? null : openMeasure();
  if (id === 'water') return fillWater();
  g.classList.remove('shake'); void g.getBBox(); g.classList.add('shake');   // not built yet
  setTimeout(() => g.classList.remove('shake'), 500);
  showToast(`${TARGETS[id].name}: coming soon!`);
}

// ---------- Picker ----------
const picker = document.getElementById('picker'), strip = document.getElementById('pkStrip'), nextBtn = document.getElementById('pkNext');
const EMPTY_PAW = `<svg viewBox="-24 -26 48 48">${ICONS.paw.replace(/#8a5a3b/g, '#3bb273')}</svg>`;
function openOverlay(el) { el.classList.add('open'); el.setAttribute('aria-hidden', 'false'); }
function closeOverlay(el) { el.classList.remove('open'); el.setAttribute('aria-hidden', 'true'); }

function openPicker(k) {
  kind = k; page = 0;
  const list = PETS[k], pages = Math.max(1, Math.ceil(list.length / 8));
  document.getElementById('pkTitle').textContent = k === 'dog' ? 'Pick a dog' : 'Pick a cat';
  let s = '';
  for (let p = 0; p < pages; p++) {
    s += '<div class="pk-page">';
    for (let i = p * 8; i < p * 8 + 8; i++) {
      const a = list[i];
      s += a ? `<button class="pk-card" data-pet="${a.id}" aria-label="${a.name}"><img src="${ART[a.art]}" alt=""><span class="pk-name">${a.name}</span></button>`
             : `<div class="pk-card empty" aria-hidden="true">${EMPTY_PAW}<span class="pk-name">Coming soon</span></div>`;
    }
    s += '</div>';
  }
  strip.innerHTML = s;
  strip.style.transition = 'none'; strip.style.transform = 'translateX(0)'; void strip.offsetWidth; strip.style.transition = '';
  nextBtn.disabled = pages < 2;
  openOverlay(picker);
}

nextBtn.addEventListener('click', () => {
  const pages = strip.children.length;
  if (pages < 2) return;
  page = (page + 1) % pages;
  strip.style.transform = `translateX(${-100 * page}%)`;
});
document.getElementById('pkClose').addEventListener('click', () => closeOverlay(picker));
picker.addEventListener('click', e => {
  if (e.target === picker) return closeOverlay(picker);
  const c = e.target.closest('.pk-card[data-pet]');
  if (c) choosePet(PETS[kind].find(a => a.id === c.dataset.pet));
});

function choosePet(a) {
  pet = Object.assign({}, a); closeOverlay(picker);
  const pic = new Image();
  pic.onload = () => {
    const h = RUG.h, w = h * pic.width / pic.height, x = RUG.cx - w / 2, y = RUG.bottom - h;
    document.getElementById('petLayer').innerHTML =
      `<g class="petg" role="button" tabindex="0" aria-label="${a.name}">${ringSvg(x - 24, y - 20, w + 48, h + 36)}
        <image class="pet in" href="${ART[a.art]}" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
    setTask(1);
  };
  pic.src = ART[a.art];
}

// ---------- Weigh: drag the pet onto the scale (or tap the scale) ----------
function petMove(dx, dy, k, ms) {
  const g = document.querySelector('.petg');
  g.style.transition = ms ? `transform ${ms}ms ease-in-out` : 'none';
  g.style.transformOrigin = `${RUG.cx}px ${RUG.bottom}px`;
  g.style.transform = `translate(${dx}px, ${dy}px) scale(${k})`;
}
function svgPoint(e) {
  const p = room.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(room.getScreenCTM().inverse());
}
let drag = null;
room.addEventListener('pointerdown', e => {
  const g = e.target.closest('.petg.drag');
  if (!g || busy) return;
  drag = { start: svgPoint(e), moved: false, dx: 0, dy: 0 }; g.classList.add('dragging');
  room.setPointerCapture(e.pointerId);
});
room.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = svgPoint(e), dx = p.x - drag.start.x, dy = p.y - drag.start.y;
  if (Math.hypot(dx, dy) > 8) drag.moved = true;
  petMove(dx, dy, 1, 0);
  drag.dx = dx; drag.dy = dy;
});
room.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  document.querySelector('.petg').classList.remove('dragging');
  if (!d.moved) return;
  const fx = RUG.cx + d.dx, fy = RUG.bottom + d.dy, s = TARGETS.scale;   // where the pet's feet are
  if (fx > s.x - 140 && fx < s.x + s.w + 140 && fy > s.y - 260 && fy < s.y + s.h + 120) weigh();
  else petMove(0, 0, 1, 350);   // not on the scale: back to the rug
});

function weigh() {
  if (busy || TASKS[task].icon !== 'scale') return;
  busy = true;
  document.querySelector('.petg').classList.remove('drag');
  room.querySelector('[data-t="scale"]').classList.remove('on');
  guideEl.classList.add('hide');
  petMove(ON_SCALE.cx - RUG.cx, ON_SCALE.bottom - RUG.bottom, ON_SCALE.k, 600);
  const ro = document.getElementById('readout'), num = document.getElementById('readNum');
  num.textContent = '0 lb';
  setTimeout(() => {
    ro.classList.add('show');
    let n = 0; const steps = 12;
    const tick = setInterval(() => {
      n++; num.textContent = `${Math.round(pet.weight * n / steps)} lb`;
      if (n >= steps) { clearInterval(tick); setTimeout(showWeightCard, 450); }
    }, 55);
  }, 650);
}

function cupSvg(cups) {
  // a glass measuring cup with lines at 1/4, 1/2, 3/4 and 1 cup, filled with food to this much
  const top = 12, bot = 74, fillY = bot - (bot - top) * cups;
  let lines = '';
  for (const q of [.25, .5, .75, 1]) { const y = bot - (bot - top) * q; lines += `<rect x="12" y="${y - 1.5}" width="12" height="3" rx="1.5" fill="#7aa6c8"/>`; }
  return `<svg viewBox="0 0 64 80"><rect x="8" y="6" width="44" height="70" rx="10" fill="#e6f2fb"/>
    <rect x="8" y="${fillY}" width="44" height="${bot - fillY + 2}" rx="${cups === 1 ? 10 : 4}" fill="#c98a5a"/>
    <circle cx="20" cy="${fillY + 8}" r="3" fill="#a86d43"/><circle cx="34" cy="${fillY + 12}" r="3" fill="#a86d43"/>
    ${lines}<path d="M52 22 h6 a6 6 0 0 1 6 6 v18 a6 6 0 0 1 -6 6 h-6" fill="none" stroke="#e6f2fb" stroke-width="6"/></svg>`;
}

function showWeightCard() {
  const rule = foodFor(pet, kind);
  pet.food = rule.cups;   // the food step will use this
  document.getElementById('wtTitle').textContent = `${pet.name} weighs`;
  document.getElementById('wtBig').textContent = `${pet.weight} pounds`;
  document.getElementById('wtSays').innerHTML = `So ${pet.name} eats <b>${CUPS[rule.cups]}</b> of food.`;
  document.getElementById('wtChart').innerHTML = FOOD[kind].map(r =>
    `<div class="wt-col${r === rule ? ' me' : ''}">${cupSvg(r.cups)}<b>${CUPS[r.cups]}</b><span>${r.label}</span></div>`).join('');
  openOverlay(document.getElementById('weightCard'));
}
document.getElementById('wtOk').addEventListener('click', () => {
  closeOverlay(document.getElementById('weightCard'));
  document.getElementById('readout').classList.remove('show');
  petMove(0, 0, 1, 600);   // back to the rug
  setTimeout(() => { busy = false; setTask(2); }, 650);
});


// ---------- Food and water ----------
// Measuring: the player holds the food bin to pour into the measuring cup, lets go at the pet's line,
// takes some out with the spoon if it is too much, then taps the bowl to pour it in.
const POUR_RATE = .12;     // cups per second while holding the bin (1 cup takes about 8 seconds)
const CLOSE_ENOUGH = .045; // how near the line counts as just right
// The measuring cup picture (cup.webp, 360 x 307) sits at CUP.x, CUP.y. Inside the glass, empty is at y0 and 1 cup is at y1.
const CUP = { x: 430, y: 150, w: 360, h: 307, y0: 410, y1: 228, left0: 485, left1: 452, right0: 680, right1: 702 };
const BOWL_OPEN = { cx: .53, cy: .30, rx: .35, ry: .18 };   // the bowl's opening, as parts of the bowl picture
const EAT = { h: 330, cx: 1010, nose: [.15, .86] };       // the eating picture on the rug, and where its nose is
let ms = null, fed = false, watered = false;

const cupY = c => CUP.y0 - (CUP.y0 - CUP.y1) * c;
function cupInside(c) {   // the glass's inside from the bottom up to c cups (it is a little wider at the top)
  const y = cupY(c), t = (CUP.y0 - y) / (CUP.y0 - CUP.y1);
  const l = CUP.left0 + (CUP.left1 - CUP.left0) * t, r = CUP.right0 + (CUP.right1 - CUP.right0) * t;
  return `M${CUP.left0},${CUP.y0 - 10} Q${CUP.left0 + 4},${CUP.y0 + 8} ${(CUP.left0 + CUP.right0) / 2},${CUP.y0 + 10} Q${CUP.right0 - 4},${CUP.y0 + 8} ${CUP.right0},${CUP.y0 - 10} L${r},${y} Q${(l + r) / 2},${y - 8} ${l},${y} Z`;
}
function kibbleDots(c) {
  let s = '';
  if (c <= 0) return s;
  const top = cupY(c);
  for (let i = 0; i < 26; i++) {
    const y = CUP.y0 - 10 - ((i * 37) % 100) / 100 * (CUP.y0 - 10 - top), x = 510 + ((i * 53) % 160);
    if (y > top + 6) s += `<circle cx="${x}" cy="${y}" r="5" fill="#a86d43"/>`;
  }
  return s;
}

function binSvg() {
  return `<g class="ms-bin" id="msBin" role="button" tabindex="0" aria-label="Food bin, hold to pour" transform="translate(-40 0)">
    ${ringSvg(40, 70, 290, 420)}
    <g class="tilt">
      <rect x="70" y="150" width="230" height="320" rx="34" fill="#e3eef0"/>
      <path d="M78 250 Q120 232 160 250 T240 248 T292 250 V440 Q292 462 270 462 H100 Q78 462 78 440 Z" fill="#b98557"/>
      <circle cx="120" cy="300" r="7" fill="#9a6a42"/><circle cx="190" cy="340" r="7" fill="#9a6a42"/><circle cx="245" cy="290" r="7" fill="#9a6a42"/><circle cx="150" cy="400" r="7" fill="#9a6a42"/><circle cx="230" cy="410" r="7" fill="#9a6a42"/>
      <rect x="92" y="170" width="22" height="270" rx="11" fill="#fff" opacity=".45"/>
      <g class="lid"><rect x="58" y="118" width="254" height="44" rx="20" fill="#c4a690"/><rect x="160" y="96" width="50" height="30" rx="14" fill="#b39581"/></g>
    </g>
    ${[0, 1, 2, 3, 4, 5].map(i => `<circle class="kib" cx="318" cy="${150 + i * 4}" r="${7 - (i % 3)}" fill="#a86d43" style="--dx:${230 + i * 14}px;--dy:${140 + i * 18}px;animation-delay:${i * .08}s"/>`).join('')}
  </g>`;
}

function drawMeasure() {
  const goal = pet.food, lines = [.25, .5, .75, 1];
  let s = binSvg();
  s += `<g class="ms-bowl" id="msBowl" role="button" tabindex="0" aria-label="Food bowl, tap to pour the food in">
    ${ringSvg(770, 330, 220, 180)}
    <image href="${ART.bowlFood}" x="790" y="360" width="180" height="${180 * 236 / 360}"/>
    <ellipse class="bowlfood" id="msBowlFood" cx="${790 + 180 * BOWL_OPEN.cx}" cy="${360 + 118 * BOWL_OPEN.cy}" rx="${180 * BOWL_OPEN.rx * .9}" ry="${118 * BOWL_OPEN.ry * .9}" fill="#b98557" opacity="0"/></g>`;
  s += `<g class="ms-cup" id="msCup"><image href="${ART.cup}" x="${CUP.x}" y="${CUP.y}" width="${CUP.w}" height="${CUP.h}"/>
    <g opacity=".88"><path id="msFood" d="" fill="#c98a5a"/><g id="msDots"></g></g>`;
  lines.forEach((c, i) => {
    const y = cupY(c), t = (CUP.y0 - y) / (CUP.y0 - CUP.y1), l = CUP.left0 + (CUP.left1 - CUP.left0) * t;
    s += `<g class="ms-line" data-c="${c}">
      <rect class="glow" x="${l - 6}" y="${y - 9}" width="86" height="18" rx="9" fill="#fff6b0"/>
      <rect x="${l + 4}" y="${y - 3}" width="66" height="6" rx="3" fill="#4f86b8"/>
      <g class="lbl"><rect x="${l - 118}" y="${y - 22}" width="100" height="44" rx="22" fill="#fff" stroke="#4f86b8" stroke-width="4"/>
      <text x="${l - 68}" y="${y + 10}" text-anchor="middle" font-size="26" font-weight="bold" fill="#2f6390">${CUPS[c]}</text></g></g>`;
  });
  s += `</g>`;
  document.getElementById('msStage').innerHTML = s;
  setCup(0);
}
function setCup(c) {
  ms.amount = Math.max(0, Math.min(1.12, c));
  document.getElementById('msFood').setAttribute('d', ms.amount > 0 ? cupInside(ms.amount) : '');
  document.getElementById('msDots').innerHTML = kibbleDots(ms.amount);
}
const msSay = t => { document.getElementById('msSay').innerHTML = t; };
function msButtons(next, spoon) {
  const n = document.getElementById('msNext'), sp = document.getElementById('msSpoon');
  n.hidden = !next; if (next) n.textContent = next;
  sp.hidden = !spoon; sp.classList.toggle('on', spoon === 'on');
}
function msLight(bin, bowl) {
  document.getElementById('msBin').querySelector('.ring').style.opacity = bin ? 1 : '';
  document.getElementById('msBowl').querySelector('.ring').style.opacity = bowl ? 1 : '';
}

// the short lesson, then measuring
function openMeasure() {
  ms = { step: 0, amount: 0, pouring: false, done: false };
  document.getElementById('msTitle').textContent = `Measure ${pet.name}'s food`;
  drawMeasure();
  openOverlay(document.getElementById('measure'));
  lessonStep();
}
function lessonStep() {
  const lines = [...document.querySelectorAll('.ms-line')], goal = CUPS[pet.food];
  if (ms.step === 0) {
    lines.forEach((g, i) => setTimeout(() => g.classList.add('show'), 300 + i * 250));
    msSay('This is a measuring cup. The lines show how much food is inside.');
    msButtons('Next');
  } else if (ms.step === 1) {
    document.querySelector(`.ms-line[data-c="${pet.food}"]`).classList.add('goal');
    msSay(`${pet.name} needs <b>${goal}</b>. Fill the food up to the ${goal} line.`);
    msButtons('Start');
  } else {
    msSay(`Hold the food bin to pour. Let go at the ${goal} line.`);
    msButtons(null);
    msLight(true, false);
  }
}
document.getElementById('msNext').addEventListener('click', () => { ms.step++; lessonStep(); });
document.getElementById('msClose').addEventListener('click', () => { stopPour(); closeOverlay(document.getElementById('measure')); });

function startPour(e) {
  if (!ms || ms.step < 2 || ms.done || ms.pouring) return;
  if (e) e.preventDefault();
  ms.pouring = true; ms.last = performance.now();
  document.getElementById('msBin').classList.add('pour');
  document.getElementById('msStage').classList.add('pouring');
  requestAnimationFrame(pourTick);
}
function pourTick(t) {
  if (!ms || !ms.pouring) return;
  setCup(ms.amount + POUR_RATE * (t - ms.last) / 1000); ms.last = t;
  requestAnimationFrame(pourTick);
}
function stopPour() {
  if (!ms || !ms.pouring) return;
  ms.pouring = false;
  document.getElementById('msBin').classList.remove('pour');
  document.getElementById('msStage').classList.remove('pouring');
  if (ms.amount > 0) {
    msSay(`When the food is at the ${CUPS[pet.food]} line, tap the bowl to pour it in.`);
    msLight(true, true);
    msButtons(null, ms.amount > pet.food + CLOSE_ENOUGH ? 'on' : 'show');
  }
}
const stage = document.getElementById('msStage');
stage.addEventListener('pointerdown', e => { if (e.target.closest('#msBin')) { stage.setPointerCapture(e.pointerId); startPour(e); } });
stage.addEventListener('pointerup', stopPour);
stage.addEventListener('pointercancel', stopPour);
stage.addEventListener('keydown', e => { if (e.target.closest('#msBin') && (e.key === 'Enter' || e.key === ' ')) startPour(e); });
stage.addEventListener('keyup', e => { if (e.target.closest('#msBin')) stopPour(); });
document.getElementById('msSpoon').addEventListener('click', () => {
  setCup(ms.amount - .05);
  msButtons(null, ms.amount > pet.food + CLOSE_ENOUGH ? 'on' : ms.amount > 0 ? 'show' : null);
  if (ms.amount <= 0) { msLight(true, false); msSay(`Hold the food bin to pour. Let go at the ${CUPS[pet.food]} line.`); }
});
stage.addEventListener('click', e => { if (e.target.closest('#msBowl')) checkFood(); });

function checkFood() {
  if (!ms || ms.step < 2 || ms.done || ms.amount <= 0) return;
  const cup = document.getElementById('msCup'), goal = CUPS[pet.food], diff = ms.amount - pet.food;
  if (Math.abs(diff) > CLOSE_ENOUGH) {
    cup.classList.remove('wiggle'); void cup.getBBox(); cup.classList.add('wiggle');
    setTimeout(() => cup.classList.remove('wiggle'), 500);
    if (diff < 0) msSay(`Not enough yet. The food is under the ${goal} line. Pour a little more.`);
    else { msSay(`Too much! The food is over the ${goal} line. Take some out.`); msButtons(null, 'on'); }
    return;
  }
  // just right: pour it into the bowl
  ms.done = true; msLight(false, false); msButtons(null);
  msSay(`Just right! That's ${goal}.`);
  cup.classList.add('tip');
  setTimeout(() => { setCup(0); document.getElementById('msBowlFood').setAttribute('opacity', 1); }, 600);
  setTimeout(() => {
    closeOverlay(document.getElementById('measure'));
    cup.classList.remove('tip');
    feedPet();
  }, 1700);
}

// in the room: the bowl goes in front of the pet and it eats
function feedPet() {
  fed = true;
  room.querySelector('[data-t="food"]').classList.remove('on');
  const left = EAT.cx - EAT.h * 647 / 440 / 2, top = RUG.bottom - EAT.h;
  const nx = left + EAT.h * 647 / 440 * EAT.nose[0], ny = top + EAT.h * EAT.nose[1];
  const bw = 150, bh = bw * 236 / 360, bx = nx - bw / 2 - 10, by = ny - bh * BOWL_OPEN.cy - 6;
  const layer = document.getElementById('petLayer');
  layer.insertAdjacentHTML('beforeend', `<g id="foodBowl" class="bowlfood"><image href="${ART.bowlFood}" x="${bx}" y="${by}" width="${bw}" height="${bh}"/>
    <ellipse id="bowlKib" cx="${bx + bw * BOWL_OPEN.cx}" cy="${by + bh * BOWL_OPEN.cy}" rx="${bw * BOWL_OPEN.rx * .85}" ry="${bh * BOWL_OPEN.ry * .8}" fill="#b98557"/></g>`);
  setPose('eat');
  guide(`${pet.name} is eating!`);
  busy = true;
  setTimeout(() => { document.getElementById('bowlKib').setAttribute('opacity', 0); }, 2600);
  setTimeout(() => {
    setPose('sit');
    const fb = document.getElementById('foodBowl'); fb.style.opacity = 0; setTimeout(() => fb.remove(), 450);
    busy = false; afterFoodOrWater();
  }, 3200);
}
function setPose(p) {
  const img = document.querySelector('.petg image'), ring = document.querySelector('.petg .ring');
  if (p === 'eat') {
    const w = EAT.h * 647 / 440;
    img.setAttribute('href', ART[pet.eat]); img.setAttribute('x', EAT.cx - w / 2); img.setAttribute('y', RUG.bottom - EAT.h);
    img.setAttribute('width', w); img.setAttribute('height', EAT.h);
  } else {
    const h = RUG.h, w = h * 443 / 560;
    img.setAttribute('href', ART[pet.art]); img.setAttribute('x', RUG.cx - w / 2); img.setAttribute('y', RUG.bottom - h);
    img.setAttribute('width', w); img.setAttribute('height', h);
  }
  ring.style.display = 'none';
}

function fillWater() {
  if (watered || busy) return;
  watered = true;
  room.querySelector('[data-t="water"]').classList.remove('on');
  const bw = 150, bh = bw * 236 / 360, bx = 1190, by = RUG.bottom + 10 - bh;
  const cx = bx + bw * BOWL_OPEN.cx, cy = by + bh * BOWL_OPEN.cy, rx = bw * BOWL_OPEN.rx * .85, ry = bh * BOWL_OPEN.ry * .8;
  document.getElementById('petLayer').insertAdjacentHTML('afterbegin', `<g id="waterBowl"><image href="${ART.bowlWater}" x="${bx}" y="${by}" width="${bw}" height="${bh}"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#8fd0f5"><animate attributeName="rx" from="0" to="${rx}" dur=".8s"/><animate attributeName="ry" from="0" to="${ry}" dur=".8s"/></ellipse>
    <ellipse cx="${cx - rx * .35}" cy="${cy - ry * .25}" rx="${rx * .25}" ry="${ry * .2}" fill="#fff" opacity=".7"/></g>`);
  showToast(`Fresh water for ${pet.name}!`);
  afterFoodOrWater();
}
function afterFoodOrWater() {
  if (fed && watered) return setTask(3);
  guide(fed ? `Now fill ${pet.name}'s water bowl at the sink!` : `Tap the food bin to measure ${pet.name}'s food!`);
}

// ---------- Taps and keys ----------
room.addEventListener('click', e => { const g = e.target.closest('.tgt'); if (g) useTarget(g); });
room.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const g = e.target.closest('.tgt'), p = e.target.closest('.petg.drag');
  if (g || p) { e.preventDefault(); g ? useTarget(g) : weigh(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(picker); });

drawRoom();
setTask(0, true);
// coming from the town's crates: open that picker right away
if (location.hash === '#dog' || location.hash === '#cat') openPicker(location.hash.slice(1));


// ---------- go ----------
hideLoading();
</script>
</body>
</html>
