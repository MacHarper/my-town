<!-- ===== toolbar (same on every screen; paste right after <body>; follows style-guide.md) ===== -->
<style>
  #tb { position: fixed; right: 12px; bottom: 12px; z-index: 40; display: flex; align-items: flex-end; gap: 16px;
    padding: 11px 11px 15px 13px; background: #fff; border-radius: 28px;
    box-shadow: 0 0 0 2px #f3edf8, 0 10px 30px rgba(120, 60, 120, .18); font-family: Verdana, Geneva, sans-serif;
    animation: tbIn .525s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes tbIn { from { transform: translateY(130%); } to { transform: none; } }
  #tb button { font-family: inherit; border: none; -webkit-tap-highlight-color: transparent; }
  /* every toolbar button is a raised pop-out like Dress Up's trash and All Done: a solid color, a darker pressed edge and a soft shadow */
  #tb .tb-btn { --c: #e0457b; --e: #b8336a; position: relative; width: 64px; height: 64px; padding: 7px; border-radius: 18px; background: var(--c); cursor: pointer;
    box-shadow: 0 4px 0 var(--e), 0 8px 18px rgba(74, 59, 92, .15); transition: transform .126s, box-shadow .126s, filter .21s; }
  #tb .tb-btn:hover { filter: brightness(1.05); }
  #tb .tb-pink { --c: #e0457b; --e: #b8336a; } #tb .tb-blue { --c: #4a9be0; --e: #3479b8; } #tb .tb-yellow { --c: #ffc94d; --e: #d9a531; }
  #tb .tb-green { --c: #5fae7a; --e: #468a5e; } #tb .tb-gray { --c: #5f5a6b; --e: #46424f; }
  /* the pictures sit on a white badge so they show on any button color */
  #tb .tb-badge { width: 100%; height: 100%; border-radius: 12px; background: none; filter: drop-shadow(0 2px 1px rgba(74, 59, 92, .28)); display: flex; align-items: center; justify-content: center; padding: 3px; box-sizing: border-box; transition: transform .21s; }
  #tb .tb-badge .tb-ic, #tb .tb-badge svg { width: 100%; height: 100%; display: block; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
  #tb .tb-btn:hover .tb-badge, #tb .tb-btn:focus-visible .tb-badge, #tb .tb-btn:hover .tb-plain, #tb .tb-btn:focus-visible .tb-plain { transform: translateY(-3px) rotate(-6deg); }
  #tb .tb-btn:active, #tb .tb-me:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--e), 0 3px 8px rgba(74, 59, 92, .12); }
  #tb .tb-btn.wiggle .tb-badge, #tb .tb-btn.wiggle .tb-plain { animation: tbWiggle .525s; }
  @keyframes tbWiggle { 20% { transform: rotate(-14deg); } 40% { transform: rotate(11deg); } 60% { transform: rotate(-7deg); } 80% { transform: rotate(4deg); } }
  #tb .tb-btn .tb-lock { position: absolute; right: -8px; top: -8px; width: 27px; height: 27px; filter: drop-shadow(0 2px 3px rgba(74, 59, 92, .25)); }
  /* the debit card: a card picture and your money */
  #tb .tb-card { width: auto; min-width: 112px; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; padding: 6px 14px; color: #fff; }
  #tb .tb-sep { width: 4px; height: 50px; align-self: center; border-radius: 2px; background: #e6dcef; }
  #tb .tb-card .tb-plain { width: 42px; height: 28px; display: block; transition: transform .21s; }
  #tb .tb-money { font-size: 17px; font-weight: bold; line-height: 1; text-shadow: 0 1px 0 rgba(0, 0, 0, .15); }
  #tb .tb-card.bump .tb-money { animation: tbBump .5s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes tbBump { 40% { transform: scale(1.45); } }
  #tb .tb-save .tb-plain { width: 100%; height: 100%; display: block; transition: transform .21s; }
  #tb .tb-bagcount { position: absolute; right: -7px; top: -7px; min-width: 24px; height: 24px; padding: 0 5px; box-sizing: border-box; border-radius: 12px; background: #fff; color: #4a3b5c;
    font-size: 13px; font-weight: bold; line-height: 24px; text-align: center; box-shadow: 0 2px 4px rgba(74, 59, 92, .25); }
  #tb .tb-bagcount[hidden] { display: none; }
  /* even spacing (Mac, Nov 26, 2026): a number badge counts as the button's edge, so the gap is measured from the badge */
  #tb .tb-btn:has(.tb-bagcount:not([hidden])) { margin-right: 7px; }
  #tb .tb-me { --e: #f5bcd0; position: relative; width: 96px; height: 128px; margin-top: -58px; padding: 7px; border-radius: 20px; cursor: pointer;
    background: linear-gradient(#fff 55%, #ffe8f0); box-shadow: 0 4px 0 #f5bcd0, 0 8px 18px rgba(74, 59, 92, .15);
    transition: transform .126s, box-shadow .126s; }
  #tb .tb-me img, #tb .tb-me svg { width: 100%; height: 100%; display: block; object-fit: contain; }
  #tb .tb-me [hidden] { display: none; }
  #tb .tb-me img, #tb .tb-me svg { transition: transform .21s; }
  #tb .tb-me:hover img, #tb .tb-me:focus-visible img, #tb .tb-me:hover svg, #tb .tb-me:focus-visible svg { transform: translateY(-3px) rotate(-6deg); }
  #tb .tb-me.stamp { animation: tbStamp .693s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes tbStamp { 0% { transform: scale(1); } 30% { transform: scale(1.28, .78); } 60% { transform: scale(.92, 1.12); } 100% { transform: scale(1); } }
  .tb-spark { position: fixed; width: 14px; height: 14px; z-index: 96; pointer-events: none;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: tbSpark .84s ease-out forwards; }
  @keyframes tbSpark { from { transform: translate(0, 0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(90deg); opacity: 0; } }
  /* pop-ups grow from the button that opened them and close when you tap anywhere else */
  #tb .tb-panel { position: absolute; right: 80px; bottom: calc(100% + 16px); padding: 14px; background: #fff; border-radius: 22px; box-shadow: 0 0 0 2px #f3edf8, 0 10px 30px rgba(120, 60, 120, .18);
    transform: translateY(16px) scale(.6); transform-origin: 70% 100%; opacity: 0; pointer-events: none; transition: transform .263s cubic-bezier(.3, 1.5, .5, 1), opacity .21s; color: #4a3b5c; }
  #tb .tb-panel.open { transform: none; opacity: 1; pointer-events: auto; }
  #tb .tb-bag { display: grid; grid-template-columns: repeat(3, 64px); gap: 10px; }
  #tb .tb-slot { touch-action: none; position: relative; width: 64px; height: 64px; border-radius: 16px; background: #f8f4fc; box-shadow: inset 0 3px 6px rgba(120, 60, 120, .08); display: flex; align-items: center; justify-content: center; }
  #tb .tb-slot svg { width: 22px; height: 22px; opacity: .5; }
  #tb .tb-slot img { width: 84%; height: 84%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
  #tb .tb-slot.new img { animation: tbStamp .693s cubic-bezier(.3, 1.6, .5, 1); }
  #tb .tb-list { width: 290px; max-width: calc(100vw - 40px); font-size: 15px; }
  #tb .tb-list h4 { margin: 0 0 10px; font-size: 18px; text-align: center; }
  #tb .tb-lines { max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  #tb .tb-line { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; border-radius: 12px; background: #f8f4fc; }
  #tb .tb-line b { white-space: nowrap; }
  #tb .tb-line .plus { color: #3e6e4b; } #tb .tb-line .minus { color: #b8336a; }
  #tb .tb-total { display: flex; justify-content: space-between; margin-top: 10px; padding: 10px 10px 0; border-top: 3px solid #f3edf8; font-size: 18px; font-weight: bold; }
  #tb .tb-savebox { width: 260px; max-width: calc(100vw - 40px); display: flex; flex-direction: column; gap: 12px; text-align: center; }
  #tb .tb-savebox h4 { margin: 0; font-size: 18px; }
  #tb .tb-savebox p { margin: 0; font-size: 13px; line-height: 1.4; color: #6b5a80; }
  #tb .tb-big { --c: #5fae7a; --e: #468a5e; min-height: 54px; border-radius: 16px; background: var(--c); color: #fff; font-size: 19px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 0 var(--e), 0 8px 18px rgba(74, 59, 92, .15); transition: transform .126s, box-shadow .126s; }
  #tb .tb-big.blue { --c: #4a9be0; --e: #3479b8; }
  #tb .tb-big.pink { --c: #e0457b; --e: #b8336a; }
  #tb .tb-big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--e); }
  #tb .tb-big svg { width: 26px; height: 26px; }
  /* every pop-up message in every game looks the same (Mac, Nov 25, 2026: the Vet Clinic's "Your backpack is empty" box):
     a white box at the top, dark words, soft shadow. Long messages wrap instead of running off the screen. */
  html body #toast, html body #tbToast { position: fixed; z-index: 120; left: 50%; top: 14px; right: auto; bottom: auto; transform: translate(-50%, -30px);
    width: max-content; max-width: min(90vw, 640px); box-sizing: border-box; background: #fff; color: #2b2340; border: none; border-radius: 14px;
    box-shadow: 0 6px 16px rgba(74, 59, 92, .18); padding: 10px 18px; font: bold clamp(14px, 2.6vw, 18px) / 1.35 Verdana, Geneva, sans-serif;
    text-align: center; white-space: normal; opacity: 0; pointer-events: none; transition: opacity .26s, transform .26s; }
  html body #toast.show, html body #tbToast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 600px) {
    #tb { right: 6px; bottom: 6px; gap: 9px; padding: 7px 7px 10px 8px; border-radius: 22px; }
    #tb .tb-btn { width: 46px; height: 46px; padding: 5px; border-radius: 14px; }
    #tb .tb-badge { border-radius: 9px; padding: 2px; }
    #tb .tb-card { width: auto; min-width: 80px; gap: 5px; padding: 4px 8px; } #tb .tb-card .tb-plain { width: 30px; height: 20px; } #tb .tb-money { font-size: 14px; }
    #tb .tb-sep { height: 36px; width: 3px; }
    #tb .tb-me { width: 70px; height: 94px; margin-top: -42px; padding: 5px; }
    #tb .tb-panel { right: 0; } #tb .tb-bag { grid-template-columns: repeat(3, 56px); } #tb .tb-slot { width: 56px; height: 56px; }
  }
  @media (prefers-reduced-motion: reduce) { #tb, #tb .tb-me.stamp, #tb .tb-btn.wiggle .tb-badge, #tb .tb-card.bump .tb-money, #tb .tb-slot.new img { animation: none !important; } }
</style>

<script data-root="ROOT_HERE">
// Toolbar: save | money, backpack, and your person (it opens My Closet). Saved in the browser (myTown.v1) so it follows you around town.
(function () {
  const ROOT = document.currentScript.dataset.root, KEY = 'myTown.v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  window.tbData = data;
  window.tbSave = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  const $ = id => document.getElementById(id);

  // ---- every item in town: id, name, what it is (dogToy, catToy, sports, toy, game, clothing), price; pictures are items/<id>.webp ----
  const ITEMS = [
    { id: 'cat-mouse', name: 'Toy Mouse', kind: 'catToy', price: 3 },
    { id: 'cat-zoom-ball', name: 'Zoom Ball', kind: 'catToy', price: 4 },
    { id: 'cat-bell-ball', name: 'Bell Ball', kind: 'catToy', price: 4 },
    { id: 'cat-feather-ball', name: 'Feather Ball', kind: 'catToy', price: 5 },
    { id: 'cat-ball-tower', name: 'Ball Tower', kind: 'catToy', price: 8 },
    { id: 'cat-couch-blue', name: 'Blue Cat Couch', kind: 'catToy', price: 8, about: 'A comfy couch for cats. Give it to a cat at the Vet Clinic.' },
    { id: 'cat-couch-pink', name: 'Pink Cat Couch', kind: 'catToy', price: 8, about: 'A comfy couch for cats. Give it to a cat at the Vet Clinic.' },
    { id: 'game-four-in-a-row', name: '4 in a Row', kind: 'game', price: 20, play: 'four-in-a-row/four-in-a-row.html' },   // play: the game it opens
    { id: 'puzzle-candy', name: 'Candy Puzzle', kind: 'game', price: 15, play: 'candy-puzzle/candy-puzzle.html' },
    // the Community Cafe's Eat at the cafe pop-up (Mac, Nov 26, 2026): the finished foods you bake there
    { id: 'food-brownie', name: 'Sugar Brownie', kind: 'food', price: 3, about: 'A brownie with powdered sugar from the Community Cafe. Yum!' },
    { id: 'food-cookie', name: 'Sprinkle Cookie', kind: 'food', price: 2, about: 'A cookie with pink icing and sprinkles from the Community Cafe. Yum!' },
    { id: 'food-cupcake', name: 'Pink Cupcake', kind: 'food', price: 3, about: 'A cupcake with pink frosting and sprinkles from the Community Cafe. Yum!' },
    { id: 'food-muffin', name: 'Blueberry Muffin', kind: 'food', price: 3, about: 'A blueberry muffin with powdered sugar from the Community Cafe. Yum!' },
    { id: 'food-roll', name: 'Cinnamon Roll', kind: 'food', price: 4, about: 'A cinnamon roll with white icing from the Community Cafe. Yum!' },
    { id: 'food-cake', name: 'Strawberry Cake', kind: 'food', price: 8, about: 'A chocolate cake with strawberries from the Community Cafe. Yum!' },
  ];
  window.tbItems = ITEMS;
  window.tbItemPic = id => ROOT + 'items/' + id + '.webp';
  const item = id => ITEMS.find(i => i.id === id) || { id, name: id };

  // ---- money: start with $20; every change is a line in the list ----
  if (typeof data.money !== 'number') { data.money = 20; data.ledger = [{ w: 'Starting money', a: 20 }]; tbSave(); }
  data.ledger = data.ledger || [];
  data.backpack = (data.backpack || []).slice(0, 6);

  const STAR = '<svg viewBox="0 0 24 24"><polygon points="12,2 14.9,8.6 22,9.2 16.6,13.9 18.2,21 12,17.3 5.8,21 7.4,13.9 2,9.2 9.1,8.6" fill="#ddd0ec"/></svg>';
  function renderBag(newIdx) {
    $('tbPanel').innerHTML = Array.from({ length: 6 }, (_, i) => {
      const id = data.backpack[i];
      return id ? `<div class="tb-slot${i === newIdx ? ' new' : ''}" title="${item(id).name}"><img src="${tbItemPic(id)}" alt="${item(id).name}"></div>` : '<div class="tb-slot">' + STAR + '</div>';
    }).join('');
    const n = data.backpack.length; $('tbBagCount').hidden = !n; $('tbBagCount').textContent = n;
  }
  function renderMoney() {
    $('tbMoney').textContent = '$' + data.money; $('tbTotal').textContent = '$' + data.money;
    // lines in a row from the same place are grouped (Mac, Nov 25, 2026): "Bought 3 items at the Department Store", "Helped 2 animals at the Vet Clinic"
    const rows = [];
    data.ledger.forEach(l => {
      const g = moneyGroup(l), last = rows[rows.length - 1];
      if (g && last && last.g && last.g.key === g.key) { last.n++; last.a += l.a; } else rows.push({ g, n: 1, a: l.a, w: l.w });
    });
    $('tbLines').innerHTML = rows.map(r => {
      const w = r.n > 1 ? (r.g.k === 'buy' ? `Bought ${r.n} items at ${r.g.p}` : `Helped ${r.n} ${r.g.u} at ${r.g.p}`) : r.w;
      return `<div class="tb-line"><span>${w}</span><b class="${r.a < 0 ? 'minus' : 'plus'}">${r.a < 0 ? '-' : '+'}$${Math.abs(r.a)}</b></div>`;
    }).join('');
  }
  // which group a money line belongs to: games pass { p: 'the Vet Clinic', u: 'animals' } (or { p: 'the Department Store' }); older lines are read from their words
  function moneyGroup(l) {
    if (l.p) return { k: l.a < 0 ? 'buy' : 'help', p: l.p, u: l.u || 'times', key: (l.a < 0 ? 'buy|' : 'help|') + l.p };
    let m;
    if (l.a < 0 && /^Bought /.test(l.w)) return { k: 'buy', p: 'the Department Store', key: 'buy|the Department Store' };   // the only store before Nov 25, 2026
    if (l.a > 0 && (m = /^Helped .+ at (the .+)$/.exec(l.w))) return { k: 'help', p: m[1], u: /Vet Clinic/.test(m[1]) ? 'animals' : 'times', key: 'help|' + m[1] };
    return null;
  }
  function render() {
    const has = !!data.avatar;
    $('tbMeImg').hidden = !has; $('tbEmpty').toggleAttribute('hidden', has);
    if (has) $('tbMeImg').src = data.avatar;
    renderBag(); renderMoney();
  }
  let ac;
  function beep(notes, type) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime;
      notes.forEach(([f, d, l]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type || 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.14, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + l);
        o.connect(g).connect(ac.destination); o.start(t + d); o.stop(t + d + l + .05);
      });
    } catch (e) {}
  }
  window.tbBeep = beep;
  window.tbSparkle = (el, n) => {
    const r = el.getBoundingClientRect(), cols = ['#ffc94d', '#e0457b', '#7b5cd6', '#5fae7a', '#4a9be0'];
    for (let i = 0; i < (n || 14); i++) {
      const s = document.createElement('div'), a = Math.random() * 6.28, d = 45 + Math.random() * 55;
      s.className = 'tb-spark'; s.style.background = cols[i % cols.length];
      s.style.left = (r.left + r.width / 2 - 7) + 'px'; s.style.top = (r.top + r.height / 2 - 7) + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(s); setTimeout(() => s.remove(), 893);
    }
  };
  let toastT;
  // players are learning to read: a message stays up at least 4.5 seconds, longer for longer messages
  window.tbReadMs = msg => Math.max(4500, 1800 + String(msg).length * 90);
  window.tbToast = msg => { const t = $('tbToast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), tbReadMs(msg)); };
  window.tbSetAvatar = (url, extra) => {
    data.avatar = url; Object.assign(data, extra || {}); tbSave(); render();
    const b = $('tbMe'); b.classList.remove('stamp'); void b.offsetWidth; b.classList.add('stamp');
    tbSparkle(b, 18);
  };
  function wiggle(b) { b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); }
  function bump() { const c = $('tbCard'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }

  // ---- money for games: tbEarn(10, 'Helped Roxy at the Vet Clinic'); tbSpend(3, 'Bought a Toy Mouse') says false if there isn't enough ----
  window.tbMoney = () => data.money;
  window.tbEarn = (amount, words, place) => {   // place (optional): { p: 'the Vet Clinic', u: 'animals' } groups lines in a row from the same place
    data.money += amount; data.ledger.push(Object.assign({ w: words, a: amount }, place || {})); tbSave(); renderMoney(); bump();
    tbSparkle($('tbCard'), 16); beep([[784, 0, .1], [988, .08, .1], [1319, .16, .25]]);
  };
  window.tbSpend = (amount, words, place) => {   // place (optional): { p: 'the Department Store' }
    if (data.money < amount) return false;
    data.money -= amount; data.ledger.push(Object.assign({ w: words, a: -amount }, place || {})); tbSave(); renderMoney(); bump();
    return true;
  };
  // ---- backpack for games: 6 spaces; tbAddItem says false when it is full ----
  window.tbBag = () => data.backpack.slice();
  window.tbBagFull = () => data.backpack.length >= 6;
  window.tbAddItem = id => {
    if (data.backpack.length >= 6) return false;
    data.backpack.push(id); tbSave(); renderBag(data.backpack.length - 1);
    wiggle($('tbBag')); tbSparkle($('tbBag'), 14); return true;
  };
  window.tbRemoveItem = id => { const i = data.backpack.indexOf(id); if (i < 0) return false; data.backpack.splice(i, 1); tbSave(); renderBag(); return true; };
  window.tbBagButton = () => $('tbBag');
  window.tbOpenBag = () => { closePanels(); $('tbPanel').classList.add('open'); };

  // ---- pop-ups: one open at a time ----
  const PANELS = { tbBag: 'tbPanel', tbCard: 'tbMoneyPanel', tbSaveBtn: 'tbSavePanel', tbRestartBtn: 'tbRestartPanel' };
  function closePanels(except) { Object.values(PANELS).forEach(p => { if (p !== except) $(p).classList.remove('open'); }); }
  Object.entries(PANELS).forEach(([btn, panel]) => {
    $(btn).onclick = e => {
      e.stopPropagation(); wiggle($(btn)); closePanels(panel);
      const open = $(panel).classList.toggle('open');
      if (open && panel === 'tbMoneyPanel') { const l = $('tbLines'); l.scrollTop = l.scrollHeight; }
      beep(open ? [[440, 0, .1], [660, .07, .15]] : [[660, 0, .1], [440, .07, .15]]);
    };
  });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.tb-panel') && !Object.keys(PANELS).some(b => e.target.closest('#' + b))) closePanels(); });

  // ---- Save and Load: a small file you keep, so your game works on any device ----
  $('tbSaveFile').onclick = () => {
    try {
      const blob = new Blob([JSON.stringify({ game: 'My Town', saved: new Date().toISOString(), data })], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'my-town-save.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      beep([[523, 0, .1], [659, .08, .1], [784, .16, .2]]); tbSparkle($('tbSaveFile'), 14); tbToast('Your game is saved.');
    } catch (e) { tbToast('Saving did not work here.'); }
  };
  // ---- Start over (testing): wipe the save and go to the town map ----
  $('tbRestartGo').onclick = () => {
    try { localStorage.removeItem(KEY); sessionStorage.clear(); } catch (e) {}
    for (const k in data) delete data[k];   // nothing left to save back
    window.tbSave = () => {};
    beep([[784, 0, .1], [659, .08, .1], [523, .16, .2]]);
    setTimeout(() => {   // a fresh load of the town map (on the map itself, a hash change alone would not reload)
      const u = new URL(ROOT + 'index.html', location.href);
      if (u.pathname === location.pathname) { location.hash = 'town'; location.reload(); } else location.href = u.href + '#town';
    }, 300);
  };
  $('tbLoadFile').onclick = () => $('tbFile').click();
  $('tbFile').onchange = () => {
    const f = $('tbFile').files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const s = JSON.parse(rd.result);
        if (!s || s.game !== 'My Town' || typeof s.data !== 'object') throw 0;
        localStorage.setItem(KEY, JSON.stringify(s.data));
        tbToast('Your game is back!'); setTimeout(() => location.reload(), 900);
      } catch (e) { beep([[330, 0, .15], [262, .12, .2]], 'sine'); tbToast('That is not a My Town save file.'); }
      $('tbFile').value = '';
    };
    rd.readAsText(f);
  };

  $('tbMe').onclick = () => { beep([[659, 0, .12], [988, .08, .2]]); if (window.tbOnMe && tbOnMe()) return;
    // the doll opens Dress Up from anywhere; All Done brings you back to this screen (the Boutique's wardrobe does not)
    location.href = ROOT + 'dress-up/dress-up.html?back=' + encodeURIComponent(location.href); };

  // ---- games in the backpack (Mac, Nov 26, 2026): tap one and it asks Play now; the store asks Play now or Save in backpack right after you buy it ----
  const playCss = document.createElement('style');
  playCss.textContent = `
    #tbPlay { position: fixed; inset: 0; z-index: 130; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(43, 35, 64, .3); opacity: 0; pointer-events: none; transition: opacity .2s; font-family: Verdana, Geneva, sans-serif; }
    #tbPlay.open { opacity: 1; pointer-events: auto; }
    #tbPlay .tp-box { position: relative; width: min(420px, 100%); background: #fff; border-radius: 28px; box-shadow: 0 0 0 2px #f3edf8, 0 14px 38px rgba(74, 59, 92, .3); padding: 22px 22px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: #4a3b5c; transform: scale(.6); transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); box-sizing: border-box; }
    #tbPlay.open .tp-box { transform: none; }
    #tbPlay .tp-pic { width: 100%; height: min(36vh, 260px); border-radius: 22px; background: #f3edf8; display: flex; align-items: center; justify-content: center; padding: 18px; box-sizing: border-box; }
    #tbPlay .tp-pic img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #tbPlay h3 { margin: 4px 0 0; font-size: clamp(20px, 3.4vw, 28px); line-height: 1.2; }
    #tbPlay .tp-text { margin: 0 0 4px; font-size: clamp(16px, 2.6vw, 21px); line-height: 1.45; color: #2b2340; }
    #tbPlay .tp-text[hidden] { display: none; }
    #tbPlay .tp-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    #tbPlay .tp-btns button { min-height: 54px; padding: 0 26px; border: none; border-radius: 16px; color: #fff; font: bold 20px Verdana, Geneva, sans-serif; cursor: pointer; transition: transform .1s, box-shadow .1s; }
    #tbPlay .tp-go { background: #5fae7a; box-shadow: 0 5px 0 #468a5e; }
    #tbPlay .tp-save { background: #4a9be0; box-shadow: 0 5px 0 #3479b8; }
    #tbPlay .tp-btns button[hidden] { display: none; }
    #tbPlay .tp-btns button:active { transform: translateY(4px); box-shadow: none; }
    #tbPlay .tp-x { position: absolute; right: 14px; top: 14px; width: 52px; height: 52px; border: none; border-radius: 16px; background: #5f5a6b; box-shadow: 0 5px 0 #46424f; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    #tbPlay .tp-x[hidden] { display: none; }
    #tbPlay .tp-x svg { width: 22px; height: 22px; }
    /* eating a treat (Mac, Nov 27, 2026): your doll takes bites, crumbs fall, hearts float up */
    #tbPlay .tp-pic { position: relative; overflow: hidden; }
    #tbPlay .tp-eat { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; }
    #tbPlay .tp-eat[hidden], #tbPlay .tp-pic img.tp-off { display: none; }
    #tbPlay .tp-eat .te-doll { height: 94%; width: auto; max-width: none; object-fit: contain; }
    #tbPlay .tp-eat .te-food { position: absolute; width: 30%; height: auto; max-width: none; max-height: none; filter: drop-shadow(0 3px 2px rgba(0,0,0,.12)); }
    #tbPlay .te-crumb { position: absolute; width: 7px; height: 6px; border-radius: 3px; background: #c0874f; pointer-events: none; }
    #tbPlay .te-heart { position: absolute; width: 34px; height: 30px; pointer-events: none; }`;
  document.head.appendChild(playCss);
  const play = document.createElement('div'); play.id = 'tbPlay'; play.setAttribute('aria-hidden', 'true');
  play.innerHTML = `<div class="tp-box" role="dialog" aria-labelledby="tpName"><button class="tp-x" aria-label="Close"><svg viewBox="0 0 22 22"><path d="M5 5 L17 17 M17 5 L5 17" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg></button>
    <div class="tp-pic"><img alt=""><div class="tp-eat" hidden><img class="te-doll" alt=""><img class="te-food" alt=""></div></div><h3 id="tpName"></h3><p class="tp-text" hidden></p>
    <div class="tp-btns"><button class="tp-go">Play now</button><button class="tp-save">Save in backpack</button></div></div>`;
  document.body.appendChild(play);
  const closePlay = () => { play.classList.remove('open'); play.setAttribute('aria-hidden', 'true'); setTimeout(() => { if (!play.classList.contains('open')) resetEat(); }, 250); };
  window.tbAskPlay = (id, bought) => {   // bought: just bought at the store, so it also offers Save in backpack
    const it = item(id); if (!it.play) return false;
    closePanels();
    play.querySelector('img').src = tbItemPic(id);
    play.querySelector('#tpName').textContent = bought ? `You got ${it.name}!` : it.name;
    play.querySelector('.tp-save').hidden = !bought; play.querySelector('.tp-x').hidden = !!bought;
    play.querySelector('.tp-text').hidden = true; play.querySelector('.tp-go').textContent = 'Play now';
    play.querySelector('.tp-go').onclick = () => { beep([[523, 0, .1], [659, .08, .1], [784, .16, .2]]); location.href = ROOT + it.play; };
    play.classList.add('open'); play.setAttribute('aria-hidden', 'false');
    beep([[587, 0, .08], [784, .07, .12]]);
    return true;
  };
  // ---- other things in the backpack: tap one and a pop-up says what it is and where to use it (Mac, Nov 26, 2026) ----
  const USE = {
    catToy: 'A toy for cats. Give it to a cat at the Vet Clinic.',
    dogToy: 'A toy for dogs. Give it to a dog at the Vet Clinic.',
  };
  const about = it => it.about || USE[it.kind] || 'You bought this at the Department Store.';
  window.tbItemInfo = id => {
    const it = item(id);
    closePanels();
    play.querySelector('img').src = tbItemPic(id);
    play.querySelector('#tpName').textContent = it.name;
    const tx = play.querySelector('.tp-text'); tx.textContent = about(it); tx.hidden = false;
    play.querySelector('.tp-save').hidden = true; play.querySelector('.tp-x').hidden = false;
    const go = play.querySelector('.tp-go'); go.textContent = 'OK'; go.onclick = () => { closePlay(); beep([[660, 0, .1], [440, .07, .15]]); };
    if (it.kind === 'food') { go.textContent = 'Eat'; go.onclick = () => eatTreat(id); }   // treats from the cafe: eat them (Mac, Nov 27, 2026)
    play.classList.add('open'); play.setAttribute('aria-hidden', 'false');
    beep([[587, 0, .08], [784, .07, .12]]);
  };
  // ---- eating a treat (Mac, Nov 27, 2026): your doll holds it up, takes bites (crumbs fall), then hearts float up; it leaves the backpack ----
  const HEART = '<svg viewBox="0 0 34 30"><path d="M17 29 C6 21 1 15 1 9 C1 4 5 1 9.5 1 C13 1 15.5 3 17 6 C18.5 3 21 1 24.5 1 C29 1 33 4 33 9 C33 15 28 21 17 29 Z" fill="#e0457b"/><ellipse cx="9" cy="8" rx="3.5" ry="2.4" fill="#fff" opacity=".55" transform="rotate(-30 9 8)"/></svg>';
  function eatTreat(id) {
    const it = item(id), pic = play.querySelector('.tp-pic'), stage = play.querySelector('.tp-eat'), still = pic.querySelector('img');
    const doll = stage.querySelector('.te-doll'), food = stage.querySelector('.te-food'), go = play.querySelector('.tp-go'), tx = play.querySelector('.tp-text');
    tbRemoveItem(id);
    still.classList.add('tp-off'); stage.hidden = false; doll.hidden = !data.avatar; if (data.avatar) doll.src = data.avatar; food.src = tbItemPic(id);
    go.hidden = true; play.querySelector('.tp-x').hidden = true; tx.hidden = true;
    play.querySelector('#tpName').textContent = 'Yum!';
    const run = () => {
      const S = pic.getBoundingClientRect(), D = (data.avatar ? doll : pic).getBoundingClientRect();
      const mx = D.left - S.left + D.width * (data.avatar ? .62 : .5), my = D.top - S.top + D.height * (data.avatar ? .14 : .45);   // just in front of the mouth
      const fw = food.offsetWidth, fh = food.offsetHeight;
      const at = (x, y) => `translate(${x - fw / 2}px, ${y - fh / 2}px)`;
      food.style.left = '0px'; food.style.top = '0px';
      const sx = S.width * .78, sy = S.height * .8, bites = [1, .72, .48, .26, 0];
      food.animate([{ transform: at(sx, sy) + ' scale(1)' }, { transform: at(mx, my) + ' scale(1)' }], { duration: 650, easing: 'cubic-bezier(.3, 1.3, .5, 1)', fill: 'forwards' });
      bites.slice(1).forEach((k, i) => setTimeout(() => {   // a bite: the treat gets smaller, a few crumbs fall
        food.animate([{ transform: at(mx, my) + ` scale(${bites[i]})` }, { transform: at(mx + 4, my - 3) + ` scale(${(bites[i] + k) / 2 + .05})` }, { transform: at(mx, my) + ` scale(${k})` }], { duration: 260, fill: 'forwards' });
        beep([[180 + i * 20, 0, .05], [140, .06, .05]], 'square');
        for (let c = 0; c < 4; c++) {
          const b = document.createElement('i'); b.className = 'te-crumb'; b.style.left = (mx + (Math.random() - .5) * fw * .5) + 'px'; b.style.top = (my + fh * .2) + 'px'; stage.appendChild(b);
          b.animate([{ transform: 'translate(0, 0)', opacity: 1 }, { transform: `translate(${(Math.random() - .5) * 40}px, ${60 + Math.random() * 50}px)`, opacity: 0 }], { duration: 700, easing: 'ease-in' }).onfinish = () => b.remove();
        }
      }, 900 + i * 480));
      setTimeout(() => {   // all gone: hearts float up and the doll does a happy hop
        beep([[659, 0, .1], [784, .09, .1], [1047, .18, .25]]);
        if (data.avatar) doll.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-14px)' }, { transform: 'translateY(0)' }, { transform: 'translateY(-8px)' }, { transform: 'translateY(0)' }], { duration: 750, easing: 'ease-in-out' });
        for (let h = 0; h < 9; h++) setTimeout(() => {
          const e = document.createElement('div'); e.className = 'te-heart'; e.innerHTML = HEART;
          const x = mx + (Math.random() - .5) * S.width * .55, s = .6 + Math.random() * .6;
          e.style.left = (x - 17) + 'px'; e.style.top = (my + 20) + 'px'; stage.appendChild(e);
          e.animate([{ transform: `translateY(0) scale(${s * .4})`, opacity: 0 }, { transform: `translateY(-30px) scale(${s})`, opacity: 1, offset: .25 }, { transform: `translateY(-${110 + Math.random() * 60}px) scale(${s}) rotate(${(Math.random() - .5) * 30}deg)`, opacity: 0 }], { duration: 1500, easing: 'ease-out' }).onfinish = () => e.remove();
        }, h * 130);
        tx.textContent = `You loved the ${it.name}!`; tx.hidden = false;
        go.textContent = 'OK'; go.hidden = false; go.onclick = () => { closePlay(); beep([[660, 0, .1], [440, .07, .15]]); };
      }, 900 + 4 * 480 + 250);
    };
    if (doll.hidden || doll.complete) requestAnimationFrame(run); else doll.onload = () => requestAnimationFrame(run);
  }
  const resetEat = () => { const s = play.querySelector('.tp-eat'); s.hidden = true; s.querySelectorAll('.te-crumb, .te-heart').forEach(x => x.remove()); play.querySelector('.tp-pic img').classList.remove('tp-off'); play.querySelector('.tp-go').hidden = false; };
  play.querySelector('.tp-save').onclick = () => { closePlay(); wiggle($('tbBag')); tbSparkle($('tbBag'), 14); beep([[659, 0, .1], [523, .08, .15]]); };
  play.querySelector('.tp-x').onclick = () => { closePlay(); beep([[660, 0, .1], [440, .07, .15]]); };
  play.addEventListener('click', e => { if (e.target === play && play.querySelector('.tp-save').hidden) closePlay(); });
  // ---- using a thing right here (Mac, Nov 26, 2026): when the game can use it now (a cat toy while you care for a cat), you drag it
  // out of the backpack onto the spot, with no pop-up. A game says so with window.tbCanUse(id) -> a short hint ('Drag it to Luna') or false,
  // and takes it with window.tbUseItem(id, x, y) -> true when it was dropped in the right place (then it leaves the backpack).
  const slotId = slot => data.backpack[[...slot.parentNode.children].indexOf(slot)];
  const canUse = id => id && window.tbCanUse ? tbCanUse(id) : false;
  let drag = null;
  $('tbPanel').addEventListener('pointerdown', e => {
    const slot = e.target.closest('.tb-slot'); if (!slot) return; const id = slotId(slot);
    if (!canUse(id)) return;
    e.preventDefault(); drag = { id, x0: e.clientX, y0: e.clientY, ghost: null, slot };
  });
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.ghost) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
      const g = drag.ghost = document.createElement('img'); g.src = tbItemPic(drag.id); g.alt = '';
      g.style.cssText = 'position: fixed; z-index: 200; width: 96px; height: 96px; object-fit: contain; pointer-events: none; transform: translate(-50%, -50%) scale(1.1); filter: drop-shadow(0 8px 10px rgba(74, 59, 92, .3)); left: 0; top: 0;';
      document.body.appendChild(g); closePanels(); beep([[587, 0, .08], [784, .07, .12]]);
    }
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  });
  const endDrag = e => {
    if (!drag) return; const d = drag; drag = null;
    if (!d.ghost) return;   // a tap: the click below shows the hint
    let ok = false; try { ok = e.type === 'pointerup' && tbUseItem(d.id, e.clientX, e.clientY); } catch (err) {}
    if (ok) { d.ghost.remove(); tbRemoveItem(d.id); return; }
    const b = $('tbBag').getBoundingClientRect();   // not on the spot: it goes back into the backpack
    d.ghost.style.transition = 'left .35s ease-in, top .35s ease-in, opacity .35s, transform .35s'; d.ghost.style.left = (b.left + b.width / 2) + 'px'; d.ghost.style.top = (b.top + b.height / 2) + 'px';
    d.ghost.style.transform = 'translate(-50%, -50%) scale(.4)'; d.ghost.style.opacity = '0'; setTimeout(() => d.ghost.remove(), 400);
    beep([[660, 0, .1], [440, .07, .15]]);
  };
  window.addEventListener('pointerup', endDrag); window.addEventListener('pointercancel', endDrag);
  $('tbPanel').addEventListener('click', e => {
    const slot = e.target.closest('.tb-slot'); if (!slot) return;
    const id = slotId(slot);
    if (!id) return;
    const hint = canUse(id); if (hint) { tbToast(hint); wiggle(slot); return; }   // usable here: no pop-up, just how to use it
    if (item(id).play) return tbAskPlay(id);
    setTimeout(() => { if (!e.tbHandled) tbItemInfo(id); }, 0);   // a game can use the tap itself (the Vet Clinic gives the toy to the pet)
  });
  render();
})();
</script>
